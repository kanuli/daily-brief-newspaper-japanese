name: Editor-in-Chief Recovery Recheck Bridge

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - '日本語ニュース同期・品質ゲート・Discord配信'
      - '日本語ローリング翻訳品質修復'
      - 'Japanese Site Auto Maintenance'
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: editor-in-chief-recovery-recheck
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hand completed recovery back to Pages and Editor-in-Chief
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const upstream = context.payload.workflow_run || null;

            if (upstream) {
              core.info(`RECOVERY_COMPLETED name=${upstream.name} run=${upstream.id} event=${upstream.event} conclusion=${upstream.conclusion}`);
              if (upstream.name === 'Japanese Site Auto Maintenance' && upstream.event !== 'workflow_dispatch') {
                core.info(`ROUTINE_MAINTENANCE_NO_BRIDGE event=${upstream.event}`);
                return;
              }
              if (upstream.conclusion !== 'success') {
                core.warning('RECOVERY_WORKFLOW_NOT_GREEN but handoff continues because a repair job may have committed valid current data before a later publication-verification step failed.');
              }
            }

            async function active(workflow) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow,
                branch: 'main',
                per_page: 20,
              });
              return response.data.workflow_runs.find((run) => run.status !== 'completed') || null;
            }

            const pagesActive = await active('pages.yml');
            if (pagesActive) {
              core.info(`PAGES_HANDOFF_SKIPPED active_run=${pagesActive.id} status=${pagesActive.status}`);
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'pages.yml',
                ref: 'main',
              });
              core.warning('PAGES_HANDOFF_DISPATCHED explicit post-recovery deployment');
            }

            const editorActive = await active('editor-in-chief-newsroom-robot.yml');
            if (editorActive) {
              core.info(`EDITOR_RECHECK_SKIPPED active_run=${editorActive.id} status=${editorActive.status}`);
            } else {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'editor-in-chief-newsroom-robot.yml',
                ref: 'main',
              });
              core.warning('EDITOR_RECHECK_DISPATCHED post-recovery truth assessment');
            }
