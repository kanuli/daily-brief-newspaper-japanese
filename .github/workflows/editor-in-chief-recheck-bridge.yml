name: Editor-in-Chief Recovery Recheck Bridge

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - '日本語ニュース同期・品質ゲート・Discord配信'
      - '日本語ローリング翻訳品質修復'
      - 'Japanese Site Auto Maintenance'
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: editor-in-chief-recovery-recheck
  cancel-in-progress: true

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Re-run Editor-in-Chief once after a successful recovery
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const upstream = context.payload.workflow_run || null;

            if (upstream) {
              core.info(`RECOVERY_COMPLETED name=${upstream.name} run=${upstream.id} event=${upstream.event} conclusion=${upstream.conclusion}`);
              if (upstream.conclusion !== 'success') {
                core.warning('RECOVERY_RECHECK_DEFERRED upstream did not succeed; scheduled Editor-in-Chief patrol will evaluate the incident after cooldown.');
                return;
              }
              if (upstream.name === 'Japanese Site Auto Maintenance' && upstream.event !== 'workflow_dispatch') {
                core.info(`EDITOR_IN_CHIEF_RECHECK_SKIPPED maintenance event ${upstream.event} was routine, not an authorized recovery.`);
                return;
              }
            }

            let health = null;
            try {
              const response = await github.rest.repos.getContent({
                owner,
                repo,
                path: 'data/newsroom-health.json',
                ref: 'main',
              });
              if (!Array.isArray(response.data) && response.data.content) {
                health = JSON.parse(Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8'));
              }
            } catch (error) {
              core.warning(`Unable to read newsroom health before recheck: ${error.message}`);
            }

            if (health?.state === 'GREEN') {
              core.info('EDITOR_IN_CHIEF_RECHECK_SKIPPED health is already GREEN.');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'editor-in-chief-newsroom-robot.yml',
              per_page: 20,
            });
            const active = runs.data.workflow_runs.find((run) => run.status !== 'completed');
            if (active) {
              core.info(`EDITOR_IN_CHIEF_RECHECK_SKIPPED run ${active.id} is already ${active.status}.`);
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'editor-in-chief-newsroom-robot.yml',
              ref: 'main',
            });
            core.info(`EDITOR_IN_CHIEF_RECHECK_DISPATCHED previous_state=${health?.state || 'MISSING'}`);
