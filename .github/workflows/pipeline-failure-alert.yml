name: Japanese Pipeline Failure Alert

on:
  workflow_run:
    workflows:
      - '日本語ニュース同期・Discord即時配信'
      - '日本語ローリング翻訳品質修復'
      - '日本語版 Pages 公開・広東語版レイアウト同期'
      - 'F3ニュース読み再生成'
    types: [completed]

permissions:
  contents: read

jobs:
  alert:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out' || github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    steps:
      - name: Push production failure to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo 'DISCORD_WEBHOOK_URL is not configured.' >&2
            exit 1
          fi
          payload=$(python - <<'PY'
          import json, os
          name = os.environ['WORKFLOW_NAME']
          number = os.environ['RUN_NUMBER']
          conclusion = os.environ['CONCLUSION']
          url = os.environ['RUN_URL']
          text = (
              f'🚨 日本語ニュース production failure\n'
              f'{name} #{number}: {conclusion}\n'
              f'Auto Maintenance will run targeted recovery automatically.\n'
              f'{url}'
          )
          print(json.dumps({'content': text}, ensure_ascii=False))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
          echo 'DISCORD_PIPELINE_FAILURE_ALERT_OK'
