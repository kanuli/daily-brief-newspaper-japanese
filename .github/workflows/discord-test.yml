name: Discord Japanese End-to-End Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discord-test.yml"

permissions:
  contents: write

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Discord test and write success marker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"].strip()
          content = (
              "🧪 **日本語ニュース Discord 接続テスト**\n\n"
              "✅ `daily-brief-newspaper-japanese` からの自動配信テストです。\n"
              "このメッセージが表示されれば Webhook 接続は正常です。\n\n"
              "🔗 https://kanuli.github.io/daily-brief-newspaper-japanese/"
          )
          body = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []}
          }, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              webhook,
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "JapaneseDailyBriefGitHubActions-Test/1.0"
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print(f"Discord accepted test message: HTTP {response.status}")
          PY

          printf 'Discord webhook test succeeded at %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > discord-test-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-test-success.txt
          git commit -m "Record successful Discord webhook test"
          git push
