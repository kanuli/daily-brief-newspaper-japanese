name: 日本語ローリング翻訳品質修復

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/run_extra_sync_editor.py'
      - 'scripts/self_healing_extra_sync.py'
      - 'scripts/sync_cantonese_layers.py'
      - 'scripts/repair_garbled_extra_layers.py'
      - 'scripts/remote_repair_all_published_quality.py'
      - 'scripts/newsroom_quality.py'
      - 'scripts/furigana_safe_runtime.py'
      - 'scripts/validate_extra_layers.py'
      - 'scripts/safe_sync.py'
      - 'scripts/local_translation_runtime.py'
      - '.github/workflows/repair-extra-translation-quality.yml'
  workflow_run:
    workflows:
      - '日本語ニュース同期・品質ゲート・Discord配信'
    types: [completed]
  schedule:
    # Core Daily/Live starts at :15. Guaranteed rolling page coverage follows at :45.
    - cron: '45 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-extra-quality-repair
  # Never kill a repair that is already translating/publishing. GitHub keeps at
  # most one pending replacement in this group, so the newest queued edition can
  # follow the active run without starving publication.
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: Cache local Chinese-Japanese model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: Install translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: Syntax check self-healing rolling sync
        run: |
          python -m py_compile \
            scripts/cantonese_snapshot.py \
            scripts/run_extra_sync_editor.py \
            scripts/self_healing_extra_sync.py \
            scripts/sync_cantonese_layers.py \
            scripts/local_translation_runtime.py \
            scripts/remote_repair_all_published_quality.py \
            scripts/newsroom_quality.py \
            scripts/furigana_safe_runtime.py \
            scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Build minimum guaranteed reader edition first
        timeout-minutes: 12
        env:
          TOKENIZERS_PARALLELISM: 'false'
          # Availability before depth: one newest story per source-backed desk
          # and one per ticker. Later cycles can reuse translations and deepen.
          EXTRA_DESK_STORIES_PER_DESK: '1'
          EXTRA_STOCK_STORIES_PER_TICKER: '1'
          EXTRA_STOCKS_BUDGET_SECONDS: '90'
          EXTRA_TOPIC_BUDGET_SECONDS: '120'
          EXTRA_DESK_BUDGET_SECONDS: '180'
        run: python scripts/run_extra_sync_editor.py

      - name: Apply v4 newsroom and lexical-furigana repair to rolling layers
        timeout-minutes: 5
        env:
          REMOTE_REPAIR_SCOPE: rolling
        run: python scripts/remote_repair_all_published_quality.py

      - name: Validate every published rolling Japanese layer
        run: python scripts/validate_extra_layers.py

      - name: Publish current rolling layers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json
          git add -A data/topic-more
          if git diff --cached --quiet; then
            echo 'Rolling layers already match the current guaranteed edition.'
            exit 0
          fi
          git commit -m '全カテゴリの最新ニュース最低掲載数を保証して同期'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rolling guaranteed-edition rebase conflict; retrying.' >&2
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_EXTRA_GUARANTEED_EDITION_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
