name: 日本語ローリング翻訳品質修復

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/repair_garbled_extra_layers.py'
      - 'scripts/validate_content_integrity.py'
      - 'scripts/local_translation_runtime.py'
      - '.github/workflows/repair-extra-translation-quality.yml'
  workflow_run:
    workflows:
      - '日本語ニュース同期・Discord即時配信'
    types: [completed]
  schedule:
    # Current Daily/Live starts at :30. Repair existing rolling copy afterward.
    - cron: '45 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-extra-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    # Rolling/category cleanup is independent of whether the core sync succeeded.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: Cache local Chinese-Japanese model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: Install translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: Syntax check targeted repair
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/repair_garbled_extra_layers.py scripts/local_translation_runtime.py scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Repair only garbled rolling fields
        timeout-minutes: 8
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: python scripts/repair_garbled_extra_layers.py

      - name: Validate all published rolling Japanese
        run: python scripts/validate_extra_layers.py

      - name: Publish repaired rolling fields
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json data/topic-more data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'No garbled rolling fields required publication.'
            exit 0
          fi
          git commit -m '修復済みローリング日本語翻訳を公開'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Rolling repair rebase conflict; retrying.' >&2
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_EXTRA_QUALITY_REPAIR_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
