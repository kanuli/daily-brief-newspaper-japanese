name: 日本語ローリング翻訳品質修復

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/run_extra_sync_editor.py'
      - 'scripts/self_healing_extra_sync.py'
      - 'scripts/sync_cantonese_layers.py'
      - 'scripts/repair_garbled_extra_layers.py'
      - 'scripts/remote_repair_all_published_quality.py'
      - 'scripts/newsroom_quality.py'
      - 'scripts/furigana_safe_runtime.py'
      - 'scripts/validate_extra_layers.py'
      - 'scripts/safe_sync.py'
      - 'scripts/local_translation_runtime.py'
      - '.github/workflows/repair-extra-translation-quality.yml'
  schedule:
    # Core Daily/Live starts at :15. Guaranteed rolling page coverage follows at :45.
    # Event-driven recovery is owned by the Editor-in-Chief Robot. The robot
    # checks Desk/Stocks freshness first and dispatches this workflow only when
    # rolling publication is actually stale.
    - cron: '45 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-extra-quality-repair
  # Never kill a repair that is already translating/publishing. A newer trigger
  # queues behind the active guaranteed-edition publication instead of starving it.
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: Cache local Chinese-Japanese model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: Install translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: Syntax check self-healing rolling sync
        run: |
          python -m py_compile \
            scripts/cantonese_snapshot.py \
            scripts/run_extra_sync_editor.py \
            scripts/self_healing_extra_sync.py \
            scripts/sync_cantonese_layers.py \
            scripts/local_translation_runtime.py \
            scripts/remote_repair_all_published_quality.py \
            scripts/newsroom_quality.py \
            scripts/furigana_safe_runtime.py \
            scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Build minimum guaranteed reader edition first
        timeout-minutes: 12
        env:
          TOKENIZERS_PARALLELISM: 'false'
          # Availability before depth: one newest story per source-backed desk
          # and one per ticker. Later cycles can reuse translations and deepen.
          EXTRA_DESK_STORIES_PER_DESK: '1'
          EXTRA_STOCK_STORIES_PER_TICKER: '1'
          EXTRA_STOCKS_BUDGET_SECONDS: '90'
          EXTRA_TOPIC_BUDGET_SECONDS: '120'
          EXTRA_DESK_BUDGET_SECONDS: '180'
        run: python scripts/run_extra_sync_editor.py

      - name: Validate minimum current rolling edition
        run: python scripts/validate_extra_layers.py

      - name: Publish minimum current rolling edition immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json
          git add -A data/topic-more
          if git diff --cached --quiet; then
            echo 'Minimum rolling edition already matches production.'
            exit 0
          fi
          git commit -m '最新ローリングニュース最低掲載版を先行公開'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Minimum rolling publication rebase conflict; retrying.' >&2
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_EXTRA_MINIMUM_CURRENT_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Apply optional v4 newsroom and lexical-furigana enhancement
        id: optional_enhancement
        timeout-minutes: 5
        continue-on-error: true
        env:
          REMOTE_REPAIR_SCOPE: rolling
        run: python scripts/remote_repair_all_published_quality.py

      - name: Validate optional enhanced rolling Japanese layer
        id: enhanced_validation
        if: steps.optional_enhancement.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_extra_layers.py

      - name: Publish optional enhanced rolling layer when valid
        if: steps.optional_enhancement.outcome == 'success' && steps.enhanced_validation.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json
          git add -A data/topic-more
          if git diff --cached --quiet; then
            echo 'No post-publication enhancement changes.'
            exit 0
          fi
          git commit -m 'ローリングニュース編集品質を追加修復'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Optional rolling enhancement rebase conflict; minimum edition remains live.' >&2
              exit 0
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_EXTRA_ENHANCEMENT_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'Optional enhancement push did not complete; minimum edition remains live.' >&2
          exit 0
