name: Maintenance Robot — 日本語ローリング翻訳品質修復

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: japanese-extra-quality-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: Cache local Chinese-Japanese model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: Install translation dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: Syntax check rolling recovery
        run: |
          python -m py_compile \
            scripts/cantonese_snapshot.py \
            scripts/run_extra_sync_editor.py \
            scripts/self_healing_extra_sync.py \
            scripts/sync_cantonese_layers.py \
            scripts/local_translation_runtime.py \
            scripts/newsroom_quality.py \
            scripts/furigana_safe_runtime.py \
            scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Build desk minimum edition first
        id: desk_build
        timeout-minutes: 5
        env:
          TOKENIZERS_PARALLELISM: 'false'
          EXTRA_EDITOR_LAYER_SCOPE: desk
          EXTRA_DESK_STORIES_PER_DESK: '1'
          EXTRA_DESK_BUDGET_SECONDS: '150'
        run: python scripts/run_extra_sync_editor.py

      - name: Validate desk minimum edition
        env:
          EXTRA_VALIDATE_SCOPE: desk
        run: python scripts/validate_extra_layers.py

      - name: Enforce one current story for every source-backed desk
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          snapshot_dir = Path(os.environ['CANTONESE_SNAPSHOT_DIR'])
          source = json.loads((snapshot_dir / 'desk-latest.json').read_text(encoding='utf-8'))
          local = json.loads(Path('data/desk-latest.json').read_text(encoding='utf-8'))
          source_desks = source.get('desks') or {}
          local_desks = local.get('desks') or {}
          missing = []
          covered = []
          for desk, rows in source_desks.items():
              if not isinstance(rows, list) or not rows:
                  continue
              local_rows = local_desks.get(desk)
              if isinstance(local_rows, list) and local_rows:
                  covered.append(desk)
              else:
                  missing.append(desk)
          if missing:
              raise SystemExit('DESK_MINIMUM_COVERAGE_FAILED missing=' + ','.join(missing))
          print('DESK_MINIMUM_COVERAGE_OK desks=' + ','.join(covered))
          PY

      - name: Publish desk minimum edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'Desk minimum already current.'
            exit 0
          fi
          git commit -m '最新デスクニュース最低掲載版を先行公開'
          git stash push -u -m "desk-residual-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_DESK_MINIMUM_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Refresh checkout after desk publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          python scripts/cantonese_snapshot.py

      - name: Build stocks and topic minimum edition
        id: remaining_build
        timeout-minutes: 15
        env:
          TOKENIZERS_PARALLELISM: 'false'
          EXTRA_EDITOR_LAYER_SCOPE: remaining
          EXTRA_STOCK_STORIES_PER_TICKER: '1'
          EXTRA_STOCKS_BUDGET_SECONDS: '75'
          EXTRA_TOPIC_BUDGET_SECONDS: '90'
        run: python scripts/run_extra_sync_editor.py

      - name: Validate stocks and topic minimum edition
        id: remaining_validate
        env:
          EXTRA_VALIDATE_SCOPE: remaining
        run: python scripts/validate_extra_layers.py

      - name: Publish stocks and topic minimum edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/stocks-latest.json data/translation-cache.json
          git add -A data/topic-more
          if git diff --cached --quiet; then
            echo 'Remaining rolling minimum already current.'
            exit 0
          fi
          git commit -m '最新ローリングニュース最低掲載版を更新'
          git stash push -u -m "remaining-residual-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_REMAINING_MINIMUM_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Return control to the NAS Editor-in-Chief
        if: always()
        shell: bash
        run: |
          echo 'ROLLING_WORKER_COMPLETE'
          echo 'The GitHub worker does not self-dispatch another controller. The NAS Editor-in-Chief owns verification and recovery.'
