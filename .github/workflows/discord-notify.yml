name: Discord Japanese News Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: 日本語サイトリンクだけで現在のDaily・速報をテスト配信
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi
          python scripts/notify_discord.py --daily --live
          echo 'DISCORD_WEBSITE_ONLY_TEST_OK'
