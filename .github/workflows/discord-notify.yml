name: Discord Japanese News Notification

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "data/latest.json"
      - "data/live.json"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Send Japanese news update to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"].strip()
          site = "https://kanuli.github.io/daily-brief-newspaper-japanese/"
          bad_markers = (
              "Error 500 (Server Error)",
              "That’s an error",
              "That's an error",
              "Please try again later",
          )

          def post(content):
              content = content.strip()
              if len(content) > 1950:
                  content = content[:1947] + "…"
              body = json.dumps({
                  "content": content,
                  "allowed_mentions": {"parse": []}
              }, ensure_ascii=False).encode("utf-8")
              req = urllib.request.Request(
                  webhook,
                  data=body,
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "JapaneseDailyBriefGitHubActions/1.0"
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status not in (200, 204):
                      raise RuntimeError(f"Discord webhook returned HTTP {response.status}")

          def load(path):
              return json.loads(pathlib.Path(path).read_text(encoding="utf-8"))

          def previous_json(path):
              try:
                  raw = subprocess.check_output(["git", "show", f"HEAD^:{path}"], text=True)
                  return json.loads(raw)
              except Exception:
                  return None

          def corrupt(value):
              text = str(value or "")
              return any(marker in text for marker in bad_markers)

          try:
              changed = set(
                  subprocess.check_output(
                      ["git", "diff-tree", "--no-commit-id", "--name-only", "-r", "HEAD"],
                      text=True,
                  ).splitlines()
              )
          except Exception:
              changed = set()

          event = os.environ.get("GITHUB_EVENT_NAME", "")

          if event == "workflow_dispatch":
              post(
                  "🧪 **日本語ニュース Discord 接続テスト**\n\n"
                  "✅ `daily-brief-newspaper-japanese` から Discord への接続に成功しました。\n"
                  "朝刊と最新ニュース速報の更新時に自動配信します。\n\n"
                  f"🔗 日本語ニュース：{site}"
              )
              print("Discord manual connection test sent successfully.")
              raise SystemExit(0)

          if "data/latest.json" in changed:
              data = load("data/latest.json")
              articles = {a.get("id"): a for a in data.get("articles", [])}
              top = []
              for article_id in data.get("topFive", [])[:3]:
                  article = articles.get(article_id)
                  if not article:
                      continue
                  title = article.get("title", "")
                  if title and not corrupt(title):
                      top.append(title)

              if not top:
                  print("No safe Daily headlines available; Discord notification suppressed.")
                  raise SystemExit(0)

              lines = [
                  f"🗞️ **日本語デイリーニュース｜{data.get('dateLabel') or data.get('date') or '本日'}**",
                  "",
              ]
              lines += [f"{i}. {title}" for i, title in enumerate(top, 1)]
              lines += [
                  "",
                  f"🔗 今日のニュース：{site}",
                  f"🔴 最新ニュース速報：{site}live.html",
              ]
              post("\n".join(lines))
              print("Daily Japanese Discord notification sent.")
              raise SystemExit(0)

          if "data/live.json" in changed:
              current = load("data/live.json")
              previous = previous_json("data/live.json") or {}

              def fingerprint(item):
                  return (
                      item.get("id"), item.get("status"), item.get("section"),
                      item.get("title"), item.get("summary"), item.get("sourceUrl")
                  )

              old = {item.get("id"): fingerprint(item) for item in previous.get("items", [])}
              material = []
              blocked = 0
              for item in current.get("items", []):
                  item_id = item.get("id")
                  changed_item = not item_id or old.get(item_id) != fingerprint(item)
                  if not changed_item:
                      continue
                  if corrupt(item.get("title")) or corrupt(item.get("summary")):
                      blocked += 1
                      continue
                  material.append(item)

              update_label = current.get("lastUpdatedLabel") or current.get("lastUpdated") or "最新更新"
              if corrupt(update_label):
                  update_label = current.get("lastUpdated") or "最新更新"

              if not material:
                  if blocked:
                      post(
                          "⚠️ **日本語ニュース配信ガード**\n\n"
                          f"破損したニュース項目を {blocked} 件検出したため、Discordへの記事配信を停止しました。\n"
                          "Error 500 等の内容は配信していません。\n\n"
                          f"🔗 最新ニュース速報：{site}live.html"
                      )
                      print(f"Blocked {blocked} corrupted Live item(s).")
                  else:
                      print("No material Live update; Discord notification suppressed.")
                  raise SystemExit(0)

              lines = [
                  f"🔴 **最新ニュース速報｜{update_label}**",
                  "",
              ]
              for item in material[:4]:
                  status = item.get("status", "UPDATED")
                  title = item.get("title", "更新")
                  lines.append(f"**{status}** · {title}")
              if len(material) > 4:
                  lines.append(f"＋ほか {len(material) - 4} 件の更新")
              if blocked:
                  lines += ["", f"⚠️ 破損項目 {blocked} 件は配信から除外しました。"]
              lines += ["", f"🔗 最新ニュース速報：{site}live.html"]
              post("\n".join(lines))
              print("Live Japanese Discord notification sent.")
          PY
