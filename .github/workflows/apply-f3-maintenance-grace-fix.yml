name: Apply F3 Maintenance Grace Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-f3-maintenance-grace-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Replace news-age F3 grace with F3-attempt cooldown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/auto-maintenance.yml')
          text = path.read_text(encoding='utf-8')
          old = """        env:\n          GH_TOKEN: ${{ github.token }}\n          ACTIVE_COUNT: ${{ steps.workers.outputs.f3_active_count }}\n          DATA_AGE: ${{ steps.audio_qa.outputs.data_age }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ \"${ACTIVE_COUNT:-0}\" -gt 0 ]; then\n            echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n            echo 'F3 worker is already active.'\n            exit 0\n          fi\n          if [ \"${DATA_AGE:-0}\" -lt 1200 ]; then\n            echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n            echo 'Giving the production server F3 worker 20 minutes to finish.'\n            exit 0\n          fi\n          gh workflow run rebuild-f3-pacing.yml --repo \"${{ github.repository }}\" --ref main\n          echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n          echo 'F3_FALLBACK_RECOVERY_DISPATCHED'\n"""
          new = """        env:\n          GH_TOKEN: ${{ github.token }}\n          ACTIVE_COUNT: ${{ steps.workers.outputs.f3_active_count }}\n          F3_LATEST_AGE: ${{ steps.workers.outputs.f3_latest_age }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          if [ \"${ACTIVE_COUNT:-0}\" -gt 0 ]; then\n            echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n            echo 'F3 worker is already active.'\n            exit 0\n          fi\n          # Grace/cooldown is measured from the latest F3 attempt, never from\n          # the newest news commit. Hourly news therefore cannot reset this timer.\n          if [ \"${F3_LATEST_AGE:-999999}\" -lt 1200 ]; then\n            echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n            echo \"Recent F3 attempt is inside the 20-minute recovery cooldown (${F3_LATEST_AGE}s).\"\n            exit 0\n          fi\n          gh workflow run rebuild-f3-pacing.yml --repo \"${{ github.repository }}\" --ref main\n          echo 'pending=true' >> \"$GITHUB_OUTPUT\"\n          echo 'F3_FALLBACK_RECOVERY_DISPATCHED'\n"""
          if old not in text:
              raise SystemExit('Expected old F3 recovery block was not found; refusing unsafe patch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'japanese-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/auto-maintenance.yml
          git diff --cached --check
          git commit -m 'Fix F3 maintenance grace timer'
          git push origin HEAD:main
