name: Apply F3 Maintenance Grace Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-f3-maintenance-grace-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Replace news-age F3 grace with F3-attempt cooldown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/auto-maintenance.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          changed = 0

          for i, line in enumerate(lines):
              if line.strip().startswith('DATA_AGE:'):
                  lines[i] = '          F3_LATEST_AGE: $' + '{{ steps.workers.outputs.f3_latest_age }}'
                  changed += 1
              elif 'if [ "${DATA_AGE:-0}" -lt 1200 ]; then' in line:
                  lines[i] = line.replace('${DATA_AGE:-0}', '${F3_LATEST_AGE:-999999}')
                  lines.insert(i, '          # Measure grace from the latest F3 attempt, never from the newest news commit.')
                  changed += 1
                  break

          for i, line in enumerate(lines):
              if "Giving the production server F3 worker 20 minutes to finish." in line:
                  lines[i] = "            echo \"Recent F3 attempt is inside the 20-minute recovery cooldown (${F3_LATEST_AGE}s).\""
                  changed += 1
              if 'steps.audio_qa.outputs.data_age' in line and line.lstrip().startswith('elif ['):
                  lines[i] = line.replace('steps.audio_qa.outputs.data_age', 'steps.workers.outputs.f3_latest_age')
                  changed += 1
              if 'F3 audio is inside the normal 20-minute server production grace period.' in line:
                  lines[i] = line.replace(
                      'F3 audio is inside the normal 20-minute server production grace period.',
                      'The latest F3 recovery attempt is inside the 20-minute cooldown.'
                  )
                  changed += 1

          if changed < 4:
              raise SystemExit(f'Expected F3 maintenance edits were not all found; changed={changed}')

          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'japanese-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/auto-maintenance.yml
          git diff --cached --check
          git commit -m 'Fix F3 maintenance grace timer'
          git push origin HEAD:main
