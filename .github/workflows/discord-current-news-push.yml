name: Push Current Japanese News To Discord

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discord-current-news-push.yml"

permissions:
  contents: write

jobs:
  push-current-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Push current real Live news
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          data = json.loads(pathlib.Path("data/live.json").read_text(encoding="utf-8"))
          site = "https://kanuli.github.io/daily-brief-newspaper-japanese/live.html"
          bad = ("Error 500 (Server Error)", "That’s an error", "That's an error", "Please try again later")

          def corrupt(value):
              text = str(value or "")
              return any(x in text for x in bad)

          def link(item):
              urls = [item.get("sourceUrl")]
              for source in item.get("sources") or []:
                  if isinstance(source, dict):
                      urls.append(source.get("url"))
              for url in urls:
                  url = str(url or "").strip()
                  if url.startswith("http://") or url.startswith("https://"):
                      return url
              return site

          safe = []
          for item in data.get("items", []):
              if corrupt(item.get("title")) or corrupt(item.get("summary")):
                  continue
              if item.get("title"):
                  safe.append(item)
              if len(safe) >= 4:
                  break
          if not safe:
              raise RuntimeError("No safe real Live news items available")

          lines = [
              f"🔴 **最新ニュース速報｜{data.get('lastUpdatedLabel') or data.get('lastUpdated') or '最新更新'}**",
              "",
          ]
          for item in safe:
              lines.append(f"**{item.get('status', 'UPDATED')}** · **{item['title']}**")
              lines.append(f"🔗 記事リンク：{link(item)}")
          lines += ["", f"🔴 最新ニュース速報一覧：{site}"]
          content = "\n".join(lines)
          if len(content) > 1950:
              content = content[:1947] + "…"

          body = json.dumps({"content": content, "allowed_mentions": {"parse": []}}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"].strip(),
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "JapaneseDailyBriefRealNews/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print(f"REAL_JAPANESE_NEWS_DISCORD_OK HTTP {response.status}")
          PY

          printf 'Real Japanese news Discord push succeeded at %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > discord-real-news-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-real-news-success.txt
          git commit -m "Record successful real Japanese news Discord push"
          git push
