name: 日本語サイトQA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 全サイトQA
        run: |
          python scripts/validate_content_integrity.py
          python scripts/validate_site.py

      - name: JavaScript構文チェック
        run: |
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js
