name: 日本語サイトQA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: QA依存を導入
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0 \
            SudachiPy==0.6.11 \
            SudachiDict-core==20260723

      - name: 静的サイトQA
        run: python scripts/validate_site.py --static-only

      - name: Python構文・ニュース自然さQA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/newsroom_quality.py scripts/furigana_safe_runtime.py scripts/repair_garbled_core.py scripts/newsroom_postedit_core.py
          python scripts/test_newsroom_quality.py

      - name: コア本文・編集品質QA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_content_integrity.py
          python scripts/validate_editorial_quality.py

      - name: 独立ふりがなQA
        run: python scripts/validate_furigana_readings.py

      - name: 学習単語QA
        run: python scripts/validate_vocab_quality.py

      - name: 追加ローリング層QA
        run: python scripts/validate_extra_layers.py

      - name: 公開準備QA
        run: python scripts/validate_publication_readiness.py

      - name: JavaScript構文チェック
        run: |
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js
          node --check assets/js/topic-ja-rolling.js
