name: 日本語パイプライン診断

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: FFmpegを準備
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 原版同期と日本語翻訳を診断
        run: python scripts/sync_and_translate.py

      - name: Supertonic F3生成を診断
        run: python scripts/generate_supertonic_f3.py

      - name: 生成結果を検査
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          live=json.loads(Path('data/live.json').read_text(encoding='utf-8'))
          assert latest.get('language')=='ja'
          assert live.get('language')=='ja'
          assert Path('audio/manifest.json').exists()
          print('DIAGNOSTIC_OK', len(latest.get('articles',[])), len(live.get('items',[])))
          PY
