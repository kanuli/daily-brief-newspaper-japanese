name: 日本語版をGitHub Pagesへ公開

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新のmainを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: コンテンツ完全性を検証
        run: python scripts/validate_content_integrity.py

      - name: 全サイト公開前QA
        run: python scripts/validate_site.py

      - name: JavaScript構文チェック
        run: |
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
