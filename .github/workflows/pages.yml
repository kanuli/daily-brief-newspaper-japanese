name: 日本語版をGitHub Pagesへ公開

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新のmainを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 静的サイトと広東語版レイアウトパリティを検証
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_site.py --static-only
          node --check assets/js/newspaper-ja.js
          node --check assets/js/topic-ja-rolling.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js
          node --check assets/js/home-extras-ja.js
          node --check assets/js/live-article-ja.js
          node --check assets/js/stocks-ja.js
          grep -q 'ensureIntegrityGuard' assets/js/system-ja.js
          grep -q 'normalizeTopicShell' assets/js/system-ja.js
          grep -q 'topic-ja-rolling.js' assets/js/system-ja.js
          grep -q 'sanitizeCards' assets/js/live-guard.js
          grep -q 'node.textContent === label' assets/js/live-guard.js
          grep -q 'live-next-update' live.html
          grep -q 'live-article-ja.js' live.html
          grep -q 'home-extras-ja.js' index.html
          grep -q 'home-parity-ja.css' index.html
          grep -q 'stocks-ja.js' stocks.html
          grep -q 'stock-page-head' stocks.html
          grep -q 'archive-list' archive.html

      - name: コンテンツとF3の状態を判定
        id: data_health
        shell: bash
        run: |
          set +e
          python scripts/validate_content_integrity.py
          integrity_code=$?
          if [ "$integrity_code" -eq 0 ]; then
            python scripts/validate_extra_layers.py
            extra_code=$?
          else
            extra_code=$integrity_code
          fi
          if [ "$extra_code" -eq 0 ]; then
            python scripts/validate_site.py --data-only
            data_code=$?
          else
            data_code=$extra_code
          fi
          set -e
          if [ "$data_code" -eq 0 ]; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
            echo 'DEPLOY_MODE=verified-clean'
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
            echo 'DEPLOY_MODE=protected-quarantine'
            echo 'Current JSON/F3 is not fully clean. Deploying the verified static integrity guard so production does not continue serving raw translator error text.'
          fi

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開モード
        run: |
          echo "Clean data/F3: ${{ steps.data_health.outputs.clean }}"
          if [ "${{ steps.data_health.outputs.clean }}" = 'true' ]; then
            echo 'Production is serving fully verified Japanese data, Cantonese-derived rolling layers, F3 audio, and Cantonese-layout parity.'
          else
            echo 'Production is serving protected quarantine mode until the translation/F3 sync replaces dirty or incomplete data.'
          fi
