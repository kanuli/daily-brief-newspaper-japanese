name: 日本語版をGitHub Pagesへ公開

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pagesを設定
        uses: actions/configure-pages@v5
      - name: 公開ファイルを準備
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
