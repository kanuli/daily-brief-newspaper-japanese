name: 日本語版 Pages 公開・広東語版レイアウト同期
run-name: 編集品質ゲート・Pages公開 @ ${{ github.sha }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新のmainを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 公開品質検証の最小依存を導入
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0 \
            SudachiPy==0.6.11 \
            SudachiDict-core==20260723

      - name: 静的サイトの公開前ハードゲート
        shell: bash
        run: |
          set -euo pipefail
          echo "LAYOUT_DEPLOY_SHA=${GITHUB_SHA}"
          python scripts/validate_site.py --static-only
          node --check assets/js/newspaper-ja.js
          node --check assets/js/home-extras-ja.js
          node --check assets/js/home-current-ja.js
          node --check assets/js/topic-ja-rolling.js
          node --check assets/js/stocks-ja.js
          node --check assets/js/live-guard.js
          node --check assets/js/system-ja.js
          python scripts/validate_layout_parity.py || echo 'LAYOUT_PARITY_WARNING non-blocking presentation drift detected'

      - name: コア日本語・編集品質ハードゲート
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/newsroom_quality.py scripts/furigana_safe_runtime.py scripts/repair_garbled_core.py
          python scripts/validate_content_integrity.py
          python scripts/validate_editorial_quality.py
          python scripts/validate_furigana_readings.py
          python scripts/validate_vocab_quality.py
          echo 'CORE_EDITORIAL_GATE_OK'

      # Rolling Desk/Stocks is an optional freshness layer. Its frontend loaders
      # already quarantine stories that fail the same garbled-text rules and
      # fall back to validated Daily/Live content. A defect here must therefore
      # start maintenance, but must not freeze the entire site on an old Pages
      # deployment after the core edition has passed all hard gates.
      - name: 追加ローリング層隔離チェック
        id: extra_layer_health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_extra_layers.py
          echo 'EXTRA_LAYER_GATE_OK'

      - name: ローリング層異常を隔離してコア公開を継続
        if: steps.extra_layer_health.outcome != 'success'
        shell: bash
        run: |
          echo 'EXTRA_LAYER_QUARANTINED: invalid rolling stories are suppressed by topic-ja-rolling.js / stocks-ja.js; core Pages deployment continues.'

      - name: 非同期音声対応の公開準備ハードゲート
        id: data_health
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publication_readiness.py
          echo 'clean=true' >> "$GITHUB_OUTPUT"
          echo 'PUBLICATION_READINESS_GATE_OK'

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開サイトの鮮度を実地検証
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime

          base = ("${{ steps.deployment.outputs.page_url }}" or "https://kanuli.github.io/daily-brief-newspaper-japanese/").rstrip("/") + "/"
          root = pathlib.Path(".")

          def stamp(payload):
              for key in ("generatedAt", "lastUpdated", "sourceGeneratedAt", "checkedAt"):
                  value = payload.get(key) if isinstance(payload, dict) else None
                  if value:
                      try:
                          return datetime.fromisoformat(str(value).replace("Z", "+00:00")).timestamp()
                      except ValueError:
                          pass
              return 0.0

          def get(path, attempt):
              sep = "&" if "?" in path else "?"
              url = urllib.parse.urljoin(base, path) + f"{sep}post_deploy=${{ github.run_id }}-{attempt}-{int(time.time())}"
              req = urllib.request.Request(url, headers={"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "daily-brief-japanese-pages-verifier"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode("utf-8")

          expected_index = (root / "index.html").read_text(encoding="utf-8")
          marker = "home-current-ja.js?v=20260925-freshness2"
          expected = {
              "daily": json.loads((root / "data/latest.json").read_text(encoding="utf-8")),
              "live": json.loads((root / "data/live.json").read_text(encoding="utf-8")),
              "desk": json.loads((root / "data/desk-latest.json").read_text(encoding="utf-8")),
              "stocks": json.loads((root / "data/stocks-latest.json").read_text(encoding="utf-8")),
          }

          last = None
          for attempt in range(1, 13):
              try:
                  published_index = get("index.html", attempt)
                  published = {
                      "daily": json.loads(get("data/latest.json", attempt)),
                      "live": json.loads(get("data/live.json", attempt)),
                      "desk": json.loads(get("data/desk-latest.json", attempt)),
                      "stocks": json.loads(get("data/stocks-latest.json", attempt)),
                  }
                  failures = []
                  if marker in expected_index and marker not in published_index:
                      failures.append("index:stale-home-runtime")
                  if str(published["daily"].get("date", ""))[:10] < str(expected["daily"].get("date", ""))[:10]:
                      failures.append("daily:stale")
                  for key, tolerance in (("live", 60), ("desk", 3600), ("stocks", 3600)):
                      if stamp(published[key]) + tolerance < stamp(expected[key]):
                          failures.append(f"{key}:stale")
                  if not failures:
                      print(f"PRODUCTION_FRESHNESS_OK base={base}")
                      break
                  last = ",".join(failures)
                  print(f"PRODUCTION_FRESHNESS_WAIT attempt={attempt} failures={last}")
              except Exception as exc:
                  last = f"fetch:{exc}"
                  print(f"PRODUCTION_FRESHNESS_WAIT attempt={attempt} error={exc}")
              if attempt < 12:
                  time.sleep(10)
          else:
              raise SystemExit(f"PRODUCTION_FRESHNESS_FAILED after deploy: {last}")
          PY

      - name: 公開結果
        if: always()
        shell: bash
        run: |
          echo "Published candidate SHA: ${GITHUB_SHA}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Editorial gate clean: ${{ steps.data_health.outputs.clean || 'false' }}"
          echo "Rolling layer outcome: ${{ steps.extra_layer_health.outcome || 'unknown' }}"