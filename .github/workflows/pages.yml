name: 日本語版 Pages 公開・広東語版レイアウト同期
run-name: 広東語版レイアウト同期・Pages公開 @ ${{ github.sha }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 最新のmainを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 広東語版レイアウト診断（公開を止めない）
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo "LAYOUT_DEPLOY_SHA=${GITHUB_SHA}"
          python scripts/validate_site.py --static-only || true
          python scripts/validate_layout_parity.py || true
          node --check assets/js/newspaper-ja.js || true
          node --check assets/js/topic-ja-rolling.js || true
          node --check assets/js/system-ja.js || true
          echo 'Layout diagnostics completed. Deployment proceeds even if a diagnostic reports a false positive.'

      - name: コンテンツとF3診断（公開を止めない）
        id: data_health
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/validate_content_integrity.py
          integrity_code=$?
          python scripts/validate_extra_layers.py
          extra_code=$?
          python scripts/validate_site.py --data-only
          data_code=$?
          set -e
          if [ "$integrity_code" -eq 0 ] && [ "$extra_code" -eq 0 ] && [ "$data_code" -eq 0 ]; then
            echo 'clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'clean=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Pagesを設定
        uses: actions/configure-pages@v5

      - name: 静的サイトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 公開結果
        if: always()
        shell: bash
        run: |
          echo "Published candidate SHA: ${GITHUB_SHA}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Clean data/F3: ${{ steps.data_health.outputs.clean || 'unknown' }}"
