name: 日本語カテゴリーページ鮮度ウォッチドッグ

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/category-page-health-watchdog.yml'
      - 'archive.html'
      - 'assets/js/topic-ja-rolling.js'
      - 'assets/js/stocks-ja.js'
      - 'scripts/run_extra_sync_editor.py'
      - 'scripts/remote_repair_all_published_quality.py'
  schedule:
    # Rolling guaranteed edition starts at :45; verify it before the next core cycle.
    - cron: '10 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: japanese-category-page-health-watchdog
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check every reader-facing page against current upstream newsroom coverage
        id: health
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceRepo = 'daily-brief-newspaper';
            const HOUR = 60 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function localRaw(path) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                  if (Array.isArray(response.data) || !response.data.content) return null;
                  return Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8');
                } catch (error) {
                  if ([404, 409, 429, 500, 502, 503, 504].includes(error.status) && attempt < 3) {
                    core.warning(`LOCAL_READ_RETRY path=${path} status=${error.status} attempt=${attempt}`);
                    await sleep(attempt * 800);
                    continue;
                  }
                  if (error.status === 404) return null;
                  throw error;
                }
              }
              return null;
            }

            async function sourceRaw(path) {
              let last = 'unknown';
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                const url = `https://raw.githubusercontent.com/${owner}/${sourceRepo}/main/${path}?category_watch=${context.runId}-${Date.now()}-${attempt}`;
                try {
                  const response = await fetch(url, {
                    headers: {
                      'User-Agent': 'daily-brief-japanese-category-watchdog',
                      'Cache-Control': 'no-cache',
                    },
                  });
                  if (response.ok) return await response.text();
                  last = `HTTP ${response.status}`;
                  if (![404, 408, 409, 429, 500, 502, 503, 504].includes(response.status)) break;
                } catch (error) {
                  last = error.message;
                }
                if (attempt < 4) await sleep(attempt * 1000);
              }
              core.warning(`UPSTREAM_READ_UNAVAILABLE path=${path} reason=${last}`);
              return null;
            }

            async function jsonText(text, label) {
              if (!text) return null;
              try { return JSON.parse(text); }
              catch (error) {
                core.warning(`${label}: invalid JSON: ${error.message}`);
                return null;
              }
            }

            async function localJson(path) { return jsonText(await localRaw(path), path); }
            async function sourceJson(path) { return jsonText(await sourceRaw(path), `${sourceRepo}/${path}`); }

            function stamp(payload) {
              for (const value of [payload?.generatedAt, payload?.lastUpdated, payload?.sourceGeneratedAt, payload?.checkedAt]) {
                const ms = Date.parse(String(value || ''));
                if (Number.isFinite(ms)) return ms;
              }
              const day = String(payload?.date || '').slice(0, 10);
              const ms = Date.parse(`${day}T00:00:00Z`);
              return Number.isFinite(ms) ? ms : NaN;
            }

            function current(local, source, tolerance = HOUR) {
              const localMs = stamp(local), sourceMs = stamp(source);
              return Number.isFinite(localMs) && Number.isFinite(sourceMs) && localMs >= sourceMs - tolerance;
            }

            function stories(value, out = []) {
              if (Array.isArray(value)) {
                value.forEach((child) => stories(child, out));
              } else if (value && typeof value === 'object') {
                if (value.id && value.title && (value.dek || value.summary || value.body)) out.push(value);
                Object.values(value).forEach((child) => stories(child, out));
              }
              return out;
            }

            const aliases = {
              world: new Set(['world']),
              asia: new Set(['asia']),
              'hong-kong': new Set(['hong-kong']),
              japan: new Set(['japan']),
              'market-economy': new Set(['market-economy', 'finance']),
              'ai-tech': new Set(['ai-tech', 'technology', 'science-new-tech', 'cybersecurity', 'software-apps']),
              'manga-anime': new Set(['manga-anime']),
              'manchester-united': new Set(['manchester-united']),
              football: new Set(['football']),
            };

            function storySlugs(story) {
              return new Set([
                String(story?.desk || ''),
                ...((story?.deskSlugs || []).map(String)),
              ].filter(Boolean));
            }

            function matches(story, slug) {
              const accepted = aliases[slug] || new Set([slug]);
              const got = storySlugs(story);
              return [...accepted].some((value) => got.has(value));
            }

            const expectedPages = [
              ['index.html', null, 'home-current-ja.js'],
              ['live.html', null, 'live-guard.js'],
              ['archive.html', null, 'data/archive.json'],
              ['world.html', 'world', 'topic-ja-rolling.js'],
              ['asia.html', 'asia', 'topic-ja-rolling.js'],
              ['hong-kong.html', 'hong-kong', 'topic-ja-rolling.js'],
              ['japan.html', 'japan', 'topic-ja-rolling.js'],
              ['finance.html', 'market-economy', 'topic-ja-rolling.js'],
              ['technology.html', 'technology', 'topic-ja-rolling.js'],
              ['manga-anime.html', 'manga-anime', 'topic-ja-rolling.js'],
              ['manchester-united.html', 'manchester-united', 'topic-ja-rolling.js'],
              ['football.html', 'football', 'topic-ja-rolling.js'],
              ['stocks.html', null, 'stocks-ja.js'],
            ];

            const structural = [];
            for (const [path, desk, marker] of expectedPages) {
              const html = await localRaw(path);
              if (!html) {
                structural.push(`${path}:missing`);
                continue;
              }
              if (desk && !html.includes(`data-desk="${desk}"`)) structural.push(`${path}:wrong-data-desk`);
              if (marker && !html.includes(marker)) structural.push(`${path}:missing-${marker}`);
            }

            const [latest, live, localDesk, localStocks, sourceDesk, sourceStocks] = await Promise.all([
              localJson('data/latest.json'),
              localJson('data/live.json'),
              localJson('data/desk-latest.json'),
              localJson('data/stocks-latest.json'),
              sourceJson('data/desk-latest.json'),
              sourceJson('data/stocks-latest.json'),
            ]);

            if (!latest?.date) {
              core.setFailed('LOCAL_CORE_UNAVAILABLE: data/latest.json missing/invalid');
              return;
            }

            const sourceFailures = [];
            if (!sourceDesk) sourceFailures.push('desk');
            if (!sourceStocks) sourceFailures.push('stocks');
            if (sourceFailures.length) {
              core.setOutput('source_read_degraded', 'true');
              core.warning(`SOURCE_READ_DEGRADED ${sourceFailures.join(',')}; no repair is authorized from an unreadable upstream source.`);
              core.setFailed(`SOURCE_READ_DEGRADED_NO_REPAIR:${sourceFailures.join(',')}`);
              return;
            }

            const publicationDate = [latest?.date, live?.date, sourceDesk?.date]
              .filter(Boolean).sort().at(-1) || latest.date;
            const topic = await localJson(`data/topic-more/${publicationDate}.json`);

            const sourceDeskStories = stories(sourceDesk);
            const dailyStories = stories(latest?.articles || []);
            const liveStories = stories(live?.items || []);
            const deskStories = stories(localDesk || {});
            const topicStories = stories(topic || {});

            const deskCurrent = current(localDesk, sourceDesk);
            const liveCurrent = current(live, sourceDesk);
            const topicCurrent = current(topic, sourceDesk);
            const pageFailures = [];

            for (const slug of Object.keys(aliases)) {
              const upstreamCount = sourceDeskStories.filter((story) => matches(story, slug)).length;
              if (!upstreamCount) continue;
              const rollingCount = deskStories.filter((story) => matches(story, slug)).length;
              const liveCount = liveStories.filter((story) => matches(story, slug)).length;
              const topicCount = topicStories.filter((story) => matches(story, slug)).length;
              const dailyCount = dailyStories.filter((story) => matches(story, slug)).length;
              const hourlyCount = (deskCurrent ? rollingCount : 0) + (liveCurrent ? liveCount : 0) + (topicCurrent ? topicCount : 0);
              const totalCount = rollingCount + liveCount + topicCount + dailyCount;
              const status = hourlyCount > 0 ? 'PASS' : totalCount > 0 ? 'STALE' : 'EMPTY';
              core.info(`PAGE ${slug}:${status} upstream=${upstreamCount} rolling=${rollingCount} live=${liveCount} topic=${topicCount} daily=${dailyCount}`);
              if (status !== 'PASS') pageFailures.push(`${slug}:${status}`);
            }

            const localStockStories = stories(localStocks || {}).length;
            const sourceStockStories = stories(sourceStocks || {}).length;
            const stocksCurrent = current(localStocks, sourceStocks) && localStockStories > 0;
            const rollingBehind = !deskCurrent;
            const stocksBehind = sourceStockStories > 0 && !stocksCurrent;
            if (stocksBehind) pageFailures.push('stocks:STALE');

            core.info(`WATCHDOG upstreamDesk=${sourceDesk?.generatedAt || sourceDesk?.date} japaneseDesk=${localDesk?.generatedAt || localDesk?.date || 'missing'} current=${deskCurrent}`);
            core.info(`WATCHDOG upstreamStocks=${sourceStocks?.generatedAt || sourceStocks?.date} japaneseStocks=${localStocks?.generatedAt || localStocks?.date || 'missing'} current=${stocksCurrent}`);
            core.info(`WATCHDOG structural=${structural.join(',') || 'none'} readerFailures=${pageFailures.join(',') || 'none'}`);

            const repairNeeded = pageFailures.length > 0 || rollingBehind || stocksBehind;
            core.setOutput('repair_needed', repairNeeded ? 'true' : 'false');
            core.setOutput('source_read_degraded', 'false');

            if (repairNeeded) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'repair-extra-translation-quality.yml',
                per_page: 10,
              });
              const active = runs.data.workflow_runs.find((run) => run.status !== 'completed');
              if (active) {
                core.warning(`Rolling repair ${active.id} is already active; watchdog will not cancel a healthy in-progress translation job.`);
              } else {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'repair-extra-translation-quality.yml', ref: 'main' });
                core.warning('Category freshness defect confirmed against readable upstream; dispatched rolling repair.');
              }
            }

            if (structural.length) {
              core.setFailed(`Reader-facing structure defects: ${structural.join(',')}`);
            } else if (pageFailures.length || rollingBehind || stocksBehind) {
              core.setFailed(`Reader freshness defect: ${pageFailures.join(',') || `desk=${rollingBehind},stocks=${stocksBehind}`}`);
            } else {
              core.info('CATEGORY_PAGE_HEALTH_OK all source-backed category pages have current Japanese coverage');
            }
