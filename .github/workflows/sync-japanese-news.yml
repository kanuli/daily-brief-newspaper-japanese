name: 日本語ニュース同期とF3音声生成

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/sync-japanese-news.yml'

permissions:
  contents: write

concurrency:
  group: japanese-news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: FFmpegを準備
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 原版を同期して全表示項目を日本語化
        run: python scripts/sync_and_translate.py

      - name: Supertonic 3 F3でDailyとLiveの日本語音声を生成
        run: python scripts/generate_supertonic_f3.py

      - name: 全サイト・日本語・F3公開前QA
        run: python scripts/validate_site.py

      - name: JavaScript構文チェック
        run: |
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js

      - name: 更新を保存
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data audio
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi

          git commit -m '日本語ニュースとSupertonic F3音声を更新'

          # main may advance while translation/F3 generation is running (for example,
          # auto-maintenance can repair static files). Never force-push generated data.
          # Rebase this data/audio-only bot commit onto the newest main and retry safely.
          for attempt in 1 2 3 4 5; do
            echo "push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Rebase conflict detected; aborting rather than overwriting newer production content.' >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_DATA_F3_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Japanese data/F3 after 5 safe retries.' >&2
          exit 1
