name: 日本語ニュース同期・Discord即時配信

on:
  workflow_dispatch:
  schedule:
    # 広東語版の毎時公開を唯一のニュース源として、15分後に日本語版を処理する。
    # 例: 10:00 Cantonese -> 10:15 Japanese / 08:00 Daily -> 08:15 Japanese.
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-news-hourly
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 広東語版下流パイプラインを構文検査
        run: python -m py_compile scripts/sync_and_translate.py scripts/safe_sync.py scripts/fast_safe_sync.py scripts/sync_cantonese_layers.py scripts/furigana_context.py scripts/validate_furigana_readings.py scripts/validate_content_integrity.py scripts/validate_extra_layers.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版のデイリー・速報・アーカイブを差分取得して日本語化
        timeout-minutes: 12
        run: python scripts/fast_safe_sync.py

      - name: 広東語版の追加・ローリング・株式ニュースを全件保持して日本語化
        run: python scripts/sync_cantonese_layers.py

      - name: 広東語版とのソース一致を検証
        run: python scripts/check_source_drift.py

      - name: Discord配信前にニュース完全性を検証
        run: |
          python scripts/validate_content_integrity.py
          python scripts/validate_extra_layers.py

      - name: ニュース本文のふりがなを全件検証
        run: python scripts/validate_furigana_readings.py

      - name: 日本語ニュースデータを公開
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then
            latest_changed=true
          fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then
            live_changed=true
          fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo '広東語版からの実効ニュース変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '広東語版ニュースを日本語版へ同期'

          for attempt in 1 2 3 4 5; do
            echo "news push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'News-data rebase conflict; refusing to overwrite newer main.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_CANTONESE_DOWNSTREAM_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Japanese news data after 5 retries.' >&2
          exit 1

      - name: 15分後の日本語版をDiscordへ配信
        if: steps.publish_news.outputs.published == 'true' && (steps.publish_news.outputs.latest_changed == 'true' || steps.publish_news.outputs.live_changed == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = "true" ]; then
            args+=(--daily)
          fi
          if [ "$LIVE_CHANGED" = "true" ]; then
            args+=(--live)
          fi
          python scripts/notify_discord.py "${args[@]}"
