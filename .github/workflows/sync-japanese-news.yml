name: 日本語ニュース同期・品質ゲート・Discord配信

on:
  workflow_dispatch:
  # One-shot repair trigger: workflow-file changes start the repair while
  # generated news commits do not match this path, so publication cannot loop.
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-japanese-news.yml'

permissions:
  contents: write

concurrency:
  group: japanese-news-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    outputs:
      core_ok: ${{ steps.core_status.outputs.ok }}
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: ローカル中日翻訳モデルをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: 依存パッケージをインストール
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: 下流パイプラインを構文検査
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/sync_and_translate.py scripts/safe_sync.py scripts/fast_safe_sync.py scripts/local_zh_ja.py scripts/local_translation_runtime.py scripts/local_batch_prewarm.py scripts/local_fast_safe_sync.py scripts/repair_garbled_core.py scripts/emergency_remote_core_sync.py scripts/furigana_context.py scripts/furigana_safe_runtime.py scripts/validate_furigana_readings.py scripts/validate_content_integrity.py scripts/validate_editorial_quality.py scripts/validate_vocab_quality.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版mainを1コミットに固定
        run: python scripts/cantonese_snapshot.py

      - name: デイリー・速報・アーカイブを短時間だけ予熱
        timeout-minutes: 2
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          PREWARM_FILES: "latest.json,live.json,archive.json"
        run: python scripts/local_batch_prewarm.py

      - name: 完了済み翻訳キャッシュを保存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/translation-cache.json ]; then exit 0; fi
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'No new validated translation cache entries.'
            exit 0
          fi
          git commit -m 'ローカル日本語翻訳キャッシュ進捗を保存'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'LOCAL_JAPANESE_TRANSLATION_CACHE_CHECKPOINT_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: デイリー・速報・アーカイブを日本語化
        timeout-minutes: 9
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/local_fast_safe_sync.py

      - name: 文字化けした現在ニュースを遠隔優先で本修復
        timeout-minutes: 3
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/repair_garbled_core.py

      - name: 同一スナップショットとの基本ニュース一致を検証
        env:
          PARITY_SCOPE: base
        run: python scripts/check_source_drift.py

      - name: 現在ニュースの翻訳品質を検証
        run: python scripts/validate_content_integrity.py

      - name: ソース基準の独立編集品質を検証
        run: python scripts/validate_editorial_quality.py

      - name: 現在ニュースのふりがなを検証
        run: python scripts/validate_furigana_readings.py

      - name: 学習単語データを検証
        run: python scripts/validate_vocab_quality.py

      - name: degraded core fallbackを公開前に拒否
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          BAD = {'EDITORIAL_MINIMUM_FALLBACK','TRANSLATION_FAILED','TRANSLATION_DEGRADED'}
          def stories(value):
              if isinstance(value, dict):
                  if value.get('id') and (value.get('title') or value.get('summary') or value.get('body')):
                      yield value
                  for child in value.values():
                      yield from stories(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from stories(child)
          failures = []
          for name in ('latest.json','live.json'):
              data = json.loads((Path('data') / name).read_text(encoding='utf-8'))
              if data.get('translationDegraded'):
                  failures.append(f'{name}:translationDegraded=true')
              if int(data.get('translationDeferredCount') or 0) > 0:
                  failures.append(f'{name}:translationDeferredCount={data.get("translationDeferredCount")}')
              for item in stories(data):
                  status = str(item.get('translationStatus') or '').strip().upper()
                  if status in BAD:
                      failures.append(f'{name}:{item.get("id")}:translationStatus={status}')
          if failures:
              print('CORE_DEGRADED_TRANSLATION_REJECT')
              for failure in failures[:50]: print(' -', failure)
              raise SystemExit(1)
          print('CORE_TRANSLATION_COMPLETE_OK')
          PY

      - name: デイリー・速報・アーカイブを公開候補として保存
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest.json data/live.json data/archive.json
          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then latest_changed=true; fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then live_changed=true; fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo '現在ニュースの実効変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m '編集品質確認済みの現在ニュースを日本語版へ同期'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Current-news rebase conflict; refusing overwrite.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_CURRENT_NEWS_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: 通常コア同期結果を記録
        id: core_status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.publish_news.outcome }}" = 'success' ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            echo 'NORMAL_CORE_SYNC_OK'
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo 'NORMAL_CORE_SYNC_FAILED_HANDOFF_TO_REMOTE_RECOVERY'
          fi

      - name: F3 workerへ引き渡し
        if: steps.core_status.outputs.ok == 'true'
        shell: bash
        run: |
          echo 'TRANSLATION_READY_FOR_F3'
          echo 'Text publication may proceed independently; F3 audio follows asynchronously.'

  emergency_remote_core:
    name: 通常同期失敗時の遠隔コア復旧
    needs: sync
    if: ${{ always() && needs.sync.outputs.core_ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: 最新production mainを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 遠隔復旧に必要な最小依存だけを導入
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0

      - name: 遠隔復旧経路を構文検査
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/emergency_remote_core_sync.py scripts/safe_sync.py scripts/sync_and_translate.py scripts/furigana_context.py scripts/furigana_safe_runtime.py scripts/validate_content_integrity.py scripts/validate_editorial_quality.py scripts/validate_vocab_quality.py scripts/validate_furigana_readings.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版mainを1コミットに固定
        run: python scripts/cantonese_snapshot.py

      - name: ローカルモデルを使わずコアニュースを復旧
        timeout-minutes: 10
        run: python scripts/emergency_remote_core_sync.py

      - name: 復旧結果を同一スナップショットと照合
        env:
          PARITY_SCOPE: base
        run: python scripts/check_source_drift.py

      - name: 復旧した日本語本文を検証
        run: python scripts/validate_content_integrity.py

      - name: 復旧した独立編集品質を検証
        run: python scripts/validate_editorial_quality.py

      - name: 復旧したふりがなを検証
        run: python scripts/validate_furigana_readings.py

      - name: 学習単語データを検証
        run: python scripts/validate_vocab_quality.py

      - name: 遠隔復旧にもdegraded fallbackを許可しない
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          BAD = {'EDITORIAL_MINIMUM_FALLBACK','TRANSLATION_FAILED','TRANSLATION_DEGRADED'}
          def stories(value):
              if isinstance(value, dict):
                  if value.get('id') and (value.get('title') or value.get('summary') or value.get('body')):
                      yield value
                  for child in value.values(): yield from stories(child)
              elif isinstance(value, list):
                  for child in value: yield from stories(child)
          failures=[]
          for name in ('latest.json','live.json'):
              data=json.loads((Path('data')/name).read_text(encoding='utf-8'))
              if data.get('translationDegraded') or int(data.get('translationDeferredCount') or 0)>0:
                  failures.append(f'{name}:degraded-metadata')
              for item in stories(data):
                  status=str(item.get('translationStatus') or '').strip().upper()
                  if status in BAD: failures.append(f'{name}:{item.get("id")}:{status}')
          if failures:
              print('EMERGENCY_CORE_DEGRADED_TRANSLATION_REJECT')
              for failure in failures[:50]: print(' -', failure)
              raise SystemExit(1)
          print('EMERGENCY_CORE_TRANSLATION_COMPLETE_OK')
          PY

      - name: 遠隔復旧済みコアニュースを公開
        id: emergency_publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest.json data/live.json data/archive.json data/translation-cache.json
          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then latest_changed=true; fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then live_changed=true; fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"
          if git diff --cached --quiet; then
            echo 'Emergency remote recovery found no publication change.'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m '通常同期失敗を遠隔翻訳で編集品質復旧'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'EMERGENCY_REMOTE_CORE_RECOVERY_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: 緊急復旧版をF3 workerへ引き渡し
        if: steps.emergency_publish.outcome == 'success'
        shell: bash
        run: |
          echo 'EMERGENCY_TRANSLATION_READY_FOR_F3'
          echo 'Text publication may proceed independently; F3 audio follows asynchronously.'
