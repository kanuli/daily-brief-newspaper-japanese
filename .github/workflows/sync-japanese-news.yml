name: 日本語ニュース同期とF3音声生成

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/sync-japanese-news.yml'

permissions:
  contents: write

concurrency:
  group: japanese-news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: FFmpegを準備
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 原版を同期して全表示項目を日本語化
        run: python scripts/sync_and_translate.py

      - name: Supertonic 3 F3でDailyとLiveの日本語音声を生成
        run: python scripts/generate_supertonic_f3.py

      - name: 日本語版とF3音声を公開前に検査
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          latest=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          live=json.loads(Path('data/live.json').read_text(encoding='utf-8'))
          assert latest.get('language')=='ja', 'latest.json: language is not ja'
          assert live.get('language')=='ja', 'live.json: language is not ja'

          groups=(('daily',latest.get('articles',[])),('live',live.get('items',[])))
          assert groups[0][1], 'latest.json has no articles'
          manifest_path=Path('audio/manifest.json')
          assert manifest_path.exists(), 'audio/manifest.json is missing'
          manifest=json.loads(manifest_path.read_text(encoding='utf-8'))

          checked=0
          for group,items in groups:
              for a in items:
                  aid=a.get('id')
                  assert aid, f'{group}: item missing id'
                  assert str(a.get('title','')).strip(), f'{group}:{aid}: missing title'
                  assert str(a.get('summary','')).strip(), f'{group}:{aid}: missing summary'
                  audio=a.get('audio','')
                  expected_prefix=f'audio/{group}/'
                  assert audio.startswith(expected_prefix), f'{group}:{aid}: wrong F3 audio path: {audio}'
                  audio_path=Path(audio)
                  assert audio_path.exists(), f'{group}:{aid}: F3 audio file was not generated: {audio}'
                  assert audio_path.stat().st_size > 1024, f'{group}:{aid}: F3 audio is unexpectedly small: {audio}'
                  assert f'{group}:{aid}' in manifest, f'{group}:{aid}: missing from F3 manifest'
                  checked+=1
          print(f'Japanese publication gate: OK ({checked} Daily/Live items with F3 audio)')
          PY

      - name: 更新を保存
        run: |
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data audio
          if git diff --cached --quiet; then
            echo '変更なし'
            exit 0
          fi
          git commit -m '日本語ニュースとSupertonic F3音声を更新'
          git push
