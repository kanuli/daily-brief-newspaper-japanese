name: 日本語ニュース同期・Discord配信・F3音声生成

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/sync-japanese-news.yml'

permissions:
  contents: write

# Hourly news must never sit behind a long F3 build. A newer run may cancel an
# older run; news/data + Discord are deliberately completed before F3 starts.
concurrency:
  group: japanese-news-hourly
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 翻訳・Discordコードを構文検査
        run: python -m py_compile scripts/sync_and_translate.py scripts/safe_sync.py scripts/validate_content_integrity.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 原版を同期して日本語ニュースを生成
        run: python scripts/safe_sync.py

      - name: Discord配信前にニュース完全性を検証
        run: python scripts/validate_content_integrity.py

      - name: ニュースデータを先に公開
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then
            latest_changed=true
          fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then
            live_changed=true
          fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo 'ニュースデータ変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '日本語ニュースデータを更新'

          for attempt in 1 2 3 4 5; do
            echo "news push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'News-data rebase conflict; refusing to overwrite newer main.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_NEWS_DATA_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Japanese news data after 5 retries.' >&2
          exit 1

      - name: 公開ニュースをDiscordへ即時配信
        if: steps.publish_news.outputs.published == 'true' && (steps.publish_news.outputs.latest_changed == 'true' || steps.publish_news.outputs.live_changed == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = "true" ]; then
            args+=(--daily)
          fi
          if [ "$LIVE_CHANGED" = "true" ]; then
            args+=(--live)
          fi
          python scripts/notify_discord.py "${args[@]}"

      # Audio is intentionally after the website/news + Discord publication.
      # If the next hourly run starts, this older run may be cancelled here
      # without delaying the next news notification.
      - name: FFmpegを準備
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Supertonic 3 F3でDailyとLiveの日本語音声を生成
        run: python scripts/generate_supertonic_f3.py

      - name: F3公開前QA
        run: |
          python scripts/validate_content_integrity.py
          python scripts/validate_site.py
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js

      - name: F3音声を保存
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add audio data
          if git diff --cached --quiet; then
            echo 'F3変更なし'
            exit 0
          fi

          git commit -m 'Supertonic F3音声を更新'
          for attempt in 1 2 3 4 5; do
            echo "audio push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Audio rebase conflict; skip stale audio rather than block newer news.' >&2
              exit 0
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_F3_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Audio publish retries exhausted; news/Discord were already published.' >&2
          exit 0
