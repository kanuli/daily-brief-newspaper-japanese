name: 日本語ニュース同期・Discord即時配信

on:
  workflow_dispatch:
  schedule:
    # 広東語版の毎時ニュース公開後に待ち時間を確保し、取得・日本語翻訳してから公開する。
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/sync-japanese-news.yml'

permissions:
  contents: write

concurrency:
  group: japanese-news-hourly
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 翻訳・Discord・ふりがなコードを構文検査
        run: python -m py_compile scripts/sync_and_translate.py scripts/safe_sync.py scripts/furigana_context.py scripts/validate_furigana_readings.py scripts/validate_content_integrity.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版を同期して日本語ニュースを生成
        run: python scripts/safe_sync.py

      - name: Discord配信前にニュース完全性を検証
        run: python scripts/validate_content_integrity.py

      - name: 文脈依存のふりがなを全件検証
        run: python scripts/validate_furigana_readings.py

      - name: ニュースデータを公開
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then
            latest_changed=true
          fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then
            live_changed=true
          fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo 'ニュースデータ変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '日本語ニュースデータを更新'

          for attempt in 1 2 3 4 5; do
            echo "news push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'News-data rebase conflict; refusing to overwrite newer main.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_NEWS_DATA_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Japanese news data after 5 retries.' >&2
          exit 1

      - name: 公開ニュースをDiscordへ即時配信
        if: steps.publish_news.outputs.published == 'true' && (steps.publish_news.outputs.latest_changed == 'true' || steps.publish_news.outputs.live_changed == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = "true" ]; then
            args+=(--daily)
          fi
          if [ "$LIVE_CHANGED" = "true" ]; then
            args+=(--live)
          fi
          python scripts/notify_discord.py "${args[@]}"
