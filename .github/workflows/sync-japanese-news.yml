name: 日本語ニュース同期・品質ゲート・Discord配信

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/validate_content_integrity.py'
      - 'scripts/validate_editorial_quality.py'
      - 'scripts/validate_vocab_quality.py'
      - 'scripts/safe_sync.py'
      - 'scripts/local_translation_runtime.py'
      - 'scripts/local_batch_prewarm.py'
      - 'scripts/repair_garbled_core.py'
      - 'scripts/emergency_remote_core_sync.py'
      - 'scripts/furigana_safe_runtime.py'
      - 'scripts/notify_discord.py'
      - '.github/workflows/sync-japanese-news.yml'
  schedule:
    # 広東語版の毎時公開後、翻訳時間を確保して毎時15分に日本語版を処理する。
    - cron: '15 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-news-hourly
  # Never cancel an active translation/publication run. The newest queued run
  # may follow it, preventing watchdog/dispatch triggers from starving output.
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # A failed normal/local-model path is allowed to hand control to the
    # emergency job. The workflow still fails if that emergency job fails.
    continue-on-error: true
    outputs:
      core_ok: ${{ steps.core_status.outputs.ok }}
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: ローカル中日翻訳モデルをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: 依存パッケージをインストール
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: 下流パイプラインを構文検査
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/sync_and_translate.py scripts/safe_sync.py scripts/fast_safe_sync.py scripts/local_zh_ja.py scripts/local_translation_runtime.py scripts/local_batch_prewarm.py scripts/local_fast_safe_sync.py scripts/repair_garbled_core.py scripts/emergency_remote_core_sync.py scripts/furigana_context.py scripts/furigana_safe_runtime.py scripts/validate_furigana_readings.py scripts/validate_content_integrity.py scripts/validate_editorial_quality.py scripts/validate_vocab_quality.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版mainを1コミットに固定
        run: python scripts/cantonese_snapshot.py

      - name: デイリー・速報・アーカイブを短時間だけ予熱
        timeout-minutes: 2
        continue-on-error: true
        env:
          TOKENIZERS_PARALLELISM: "false"
          PREWARM_FILES: "latest.json,live.json,archive.json"
        run: python scripts/local_batch_prewarm.py

      - name: 完了済み翻訳キャッシュを保存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/translation-cache.json ]; then exit 0; fi
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'No new validated translation cache entries.'
            exit 0
          fi
          git commit -m 'ローカル日本語翻訳キャッシュ進捗を保存'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'LOCAL_JAPANESE_TRANSLATION_CACHE_CHECKPOINT_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: デイリー・速報・アーカイブを日本語化
        timeout-minutes: 9
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/local_fast_safe_sync.py

      - name: 文字化けした現在ニュースを遠隔優先で本修復
        timeout-minutes: 3
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/repair_garbled_core.py

      - name: 同一スナップショットとの基本ニュース一致を検証
        env:
          PARITY_SCOPE: base
        run: python scripts/check_source_drift.py

      - name: 現在ニュースの翻訳品質を検証
        run: python scripts/validate_content_integrity.py

      - name: ソース基準の独立編集品質を検証
        run: python scripts/validate_editorial_quality.py

      - name: 現在ニュースのふりがなを検証
        run: python scripts/validate_furigana_readings.py

      - name: 学習単語データを検証
        run: python scripts/validate_vocab_quality.py

      - name: デイリー・速報・アーカイブを公開候補として保存
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest.json data/live.json data/archive.json

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then latest_changed=true; fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then live_changed=true; fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo '現在ニュースの実効変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '編集品質確認済みの現在ニュースを日本語版へ同期'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Current-news rebase conflict; refusing overwrite.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_CURRENT_NEWS_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: 通常コア同期結果を記録
        id: core_status
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.publish_news.outcome }}" = 'success' ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
            echo 'NORMAL_CORE_SYNC_OK'
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo 'NORMAL_CORE_SYNC_FAILED_HANDOFF_TO_REMOTE_RECOVERY'
          fi

      - name: GitHub Pagesに同一ニュースが反映されたことを確認
        id: site_ready
        if: steps.core_status.outputs.ok == 'true' && steps.publish_news.outputs.published == 'true' && (steps.publish_news.outputs.latest_changed == 'true' || steps.publish_news.outputs.live_changed == 'true')
        env:
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          site='https://kanuli.github.io/daily-brief-newspaper-japanese/'
          check_file() {
            file="$1"
            expected="$(sha256sum "$file" | awk '{print $1}')"
            for attempt in $(seq 1 36); do
              remote="/tmp/$(basename "$file").remote"
              if curl -fsSL --retry 2 --retry-delay 1 "${site}${file}?deploy=${GITHUB_RUN_ID}-${attempt}" -o "$remote"; then
                actual="$(sha256sum "$remote" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  echo "PAGES_MATCH_OK ${file} ${actual}"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "PAGES_MATCH_TIMEOUT ${file}" >&2
            return 1
          }
          if [ "$LATEST_CHANGED" = 'true' ]; then check_file data/latest.json; fi
          if [ "$LIVE_CHANGED" = 'true' ]; then check_file data/live.json; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: 変更ありの毎時15分版をDiscordへ配信
        if: steps.site_ready.outputs.ready == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = "true" ]; then args+=(--daily); fi
          if [ "$LIVE_CHANGED" = "true" ]; then args+=(--live); fi
          python scripts/notify_discord.py "${args[@]}"

      - name: 変更なしでも定時xx:15のDiscordサイト更新を配信
        if: github.event_name == 'schedule' && steps.core_status.outputs.ok == 'true' && steps.publish_news.outputs.latest_changed != 'true' && steps.publish_news.outputs.live_changed != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/notify_discord.py --hourly

  emergency_remote_core:
    name: 通常同期失敗時の遠隔コア復旧
    needs: sync
    if: ${{ always() && needs.sync.outputs.core_ok != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: 最新production mainを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 遠隔復旧に必要な最小依存だけを導入
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0

      - name: 遠隔復旧経路を構文検査
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/emergency_remote_core_sync.py scripts/safe_sync.py scripts/sync_and_translate.py scripts/furigana_context.py scripts/furigana_safe_runtime.py scripts/validate_content_integrity.py scripts/validate_editorial_quality.py scripts/validate_vocab_quality.py scripts/validate_furigana_readings.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版mainを1コミットに固定
        run: python scripts/cantonese_snapshot.py

      - name: ローカルモデルを使わずコアニュースを復旧
        timeout-minutes: 10
        run: python scripts/emergency_remote_core_sync.py

      - name: 復旧結果を同一スナップショットと照合
        env:
          PARITY_SCOPE: base
        run: python scripts/check_source_drift.py

      - name: 復旧した日本語本文を検証
        run: python scripts/validate_content_integrity.py

      - name: 復旧した独立編集品質を検証
        run: python scripts/validate_editorial_quality.py

      - name: 復旧したふりがなを検証
        run: python scripts/validate_furigana_readings.py

      - name: 学習単語データを検証
        run: python scripts/validate_vocab_quality.py

      - name: 遠隔復旧済みコアニュースを公開
        id: emergency_publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest.json data/live.json data/archive.json data/translation-cache.json

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then latest_changed=true; fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then live_changed=true; fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo 'Emergency remote recovery found no publication change.'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m '通常同期失敗を遠隔翻訳で編集品質復旧'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'EMERGENCY_REMOTE_CORE_RECOVERY_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: 緊急復旧版がGitHub Pagesへ反映されたことを確認
        id: emergency_site_ready
        if: steps.emergency_publish.outputs.published == 'true' && (steps.emergency_publish.outputs.latest_changed == 'true' || steps.emergency_publish.outputs.live_changed == 'true')
        env:
          LATEST_CHANGED: ${{ steps.emergency_publish.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.emergency_publish.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          site='https://kanuli.github.io/daily-brief-newspaper-japanese/'
          check_file() {
            file="$1"
            expected="$(sha256sum "$file" | awk '{print $1}')"
            for attempt in $(seq 1 36); do
              remote="/tmp/emergency-$(basename "$file").remote"
              if curl -fsSL --retry 2 --retry-delay 1 "${site}${file}?recovery=${GITHUB_RUN_ID}-${attempt}" -o "$remote"; then
                actual="$(sha256sum "$remote" | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  echo "EMERGENCY_PAGES_MATCH_OK ${file} ${actual}"
                  return 0
                fi
              fi
              sleep 10
            done
            echo "EMERGENCY_PAGES_MATCH_TIMEOUT ${file}" >&2
            return 1
          }
          if [ "$LATEST_CHANGED" = 'true' ]; then check_file data/latest.json; fi
          if [ "$LIVE_CHANGED" = 'true' ]; then check_file data/live.json; fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: 緊急復旧版をDiscordへ配信
        if: steps.emergency_site_ready.outputs.ready == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.emergency_publish.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.emergency_publish.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = 'true' ]; then args+=(--daily); fi
          if [ "$LIVE_CHANGED" = 'true' ]; then args+=(--live); fi
          python scripts/notify_discord.py "${args[@]}"

      - name: 緊急復旧でも変更なしなら定時xx:15サイト更新を配信
        if: github.event_name == 'schedule' && steps.emergency_publish.outputs.latest_changed != 'true' && steps.emergency_publish.outputs.live_changed != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/notify_discord.py --hourly
