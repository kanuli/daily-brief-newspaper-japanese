name: 日本語ニュース同期・Discord即時配信

on:
  workflow_dispatch:
  schedule:
    # 広東語版の毎時公開を唯一のニュース源として、30分後に日本語版を処理する。
    - cron: '30 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-news-hourly
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 30

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt

      - name: ローカル中日翻訳モデルをキャッシュ
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-opus-mt-tc-big-zh-ja-v1

      - name: 依存パッケージをインストール
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: 下流パイプラインを構文検査
        run: python -m py_compile scripts/cantonese_snapshot.py scripts/sync_and_translate.py scripts/safe_sync.py scripts/fast_safe_sync.py scripts/local_zh_ja.py scripts/local_translation_runtime.py scripts/local_batch_prewarm.py scripts/local_fast_safe_sync.py scripts/furigana_context.py scripts/furigana_safe_runtime.py scripts/validate_furigana_readings.py scripts/validate_content_integrity.py scripts/check_source_drift.py scripts/notify_discord.py

      - name: 広東語版mainを1コミットに固定
        run: python scripts/cantonese_snapshot.py

      - name: デイリー・速報・アーカイブだけを小分け翻訳
        timeout-minutes: 8
        env:
          TOKENIZERS_PARALLELISM: "false"
          PREWARM_FILES: "latest.json,live.json,archive.json"
        run: python scripts/local_batch_prewarm.py

      - name: 完了済み翻訳キャッシュを保存
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/translation-cache.json ]; then exit 0; fi
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'No new validated translation cache entries.'
            exit 0
          fi
          git commit -m 'ローカル日本語翻訳キャッシュ進捗を保存'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'LOCAL_JAPANESE_TRANSLATION_CACHE_CHECKPOINT_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: デイリー・速報・アーカイブを日本語化
        timeout-minutes: 4
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: python scripts/local_fast_safe_sync.py

      - name: 同一スナップショットとの基本ニュース一致を検証
        env:
          PARITY_SCOPE: base
        run: python scripts/check_source_drift.py

      - name: 現在ニュースの翻訳品質を検証
        run: python scripts/validate_content_integrity.py

      - name: 現在ニュースのふりがなを検証
        run: python scripts/validate_furigana_readings.py

      - name: デイリー・速報・アーカイブを先に公開
        id: publish_news
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/latest.json data/live.json data/archive.json

          latest_changed=false
          live_changed=false
          if git diff --cached --name-only | grep -Fxq 'data/latest.json'; then latest_changed=true; fi
          if git diff --cached --name-only | grep -Fxq 'data/live.json'; then live_changed=true; fi
          echo "latest_changed=${latest_changed}" >> "$GITHUB_OUTPUT"
          echo "live_changed=${live_changed}" >> "$GITHUB_OUTPUT"

          if git diff --cached --quiet; then
            echo '現在ニュースの実効変更なし'
            echo 'published=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m '広東語版の現在ニュースを日本語版へ同期'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Current-news rebase conflict; refusing overwrite.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              echo 'JAPANESE_CURRENT_NEWS_PUSH_OK'
              echo 'published=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: 30分後の日本語版をDiscordへ配信
        if: steps.publish_news.outputs.published == 'true' && (steps.publish_news.outputs.latest_changed == 'true' || steps.publish_news.outputs.live_changed == 'true')
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LATEST_CHANGED: ${{ steps.publish_news.outputs.latest_changed }}
          LIVE_CHANGED: ${{ steps.publish_news.outputs.live_changed }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$LATEST_CHANGED" = "true" ]; then args+=(--daily); fi
          if [ "$LIVE_CHANGED" = "true" ]; then args+=(--live); fi
          python scripts/notify_discord.py "${args[@]}"
