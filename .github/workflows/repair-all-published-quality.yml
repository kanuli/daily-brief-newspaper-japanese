name: 日本語全公開コンテンツ品質修復

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'scripts/remote_repair_all_published_quality.py'
      - 'scripts/repair_all_published_quality.py'
      - 'scripts/safe_sync.py'
      - 'scripts/validate_content_integrity.py'
      - 'scripts/validate_extra_layers.py'
      - '.github/workflows/repair-all-published-quality.yml'
  workflow_run:
    workflows:
      - '日本語ニュース同期・Discord即時配信'
    types: [completed]
  schedule:
    - cron: '50 * * * *'

permissions:
  contents: write

concurrency:
  group: japanese-full-published-quality-repair
  cancel-in-progress: true

jobs:
  repair-rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
      REMOTE_REPAIR_SCOPE: rolling
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight repair dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0

      - name: Syntax check exhaustive remote repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/cantonese_snapshot.py \
            scripts/remote_repair_all_published_quality.py \
            scripts/safe_sync.py \
            scripts/validate_content_integrity.py \
            scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Repair all rolling Japanese from source
        timeout-minutes: 7
        run: python scripts/remote_repair_all_published_quality.py

      - name: Validate every rolling topic and stock layer
        run: python scripts/validate_extra_layers.py

      - name: Publish repaired rolling Japanese immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json data/topic-more
          if git diff --cached --quiet; then
            echo 'No rolling Japanese quality repair required.'
            exit 0
          fi
          git commit -m '全ローリング日本語の文字化けと意味不一致を修復'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'FULL_ROLLING_JAPANESE_QUALITY_REPAIR_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
