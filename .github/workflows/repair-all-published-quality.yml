name: 日本語全公開コンテンツ品質修復

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: japanese-newsroom-writer
  cancel-in-progress: false

jobs:
  repair-rolling:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CANTONESE_SNAPSHOT_DIR: .cantonese-snapshot/data
      REMOTE_REPAIR_SCOPE: rolling
      GOOGLE_429_COOLDOWN_SECONDS: "120"
    steps:
      - name: Checkout current Japanese main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight repair dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0 \
            SudachiPy==0.6.11 \
            SudachiDict-core==20260723

      - name: Syntax check exhaustive remote repair
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/cantonese_snapshot.py \
            scripts/remote_repair_all_published_quality.py \
            scripts/newsroom_quality.py \
            scripts/furigana_safe_runtime.py \
            scripts/safe_sync.py \
            scripts/sync_and_translate.py \
            scripts/validate_content_integrity.py \
            scripts/validate_extra_layers.py

      - name: Freeze one Cantonese source commit
        run: python scripts/cantonese_snapshot.py

      - name: Refuse stale upstream stock source before Japanese repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('.cantonese-snapshot/data/stocks-latest.json')
          payload = json.loads(path.read_text(encoding='utf-8'))

          stamp = None
          for key in ('generatedAt','lastUpdated','sourceGeneratedAt','checkedAt'):
              value = payload.get(key)
              if not value:
                  continue
              try:
                  stamp = datetime.fromisoformat(str(value).replace('Z','+00:00'))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  stamp = stamp.astimezone(timezone.utc)
                  break
              except ValueError:
                  pass

          if stamp is None:
              print('STOCK_UPSTREAM_ABSOLUTE_FRESHNESS_FAIL reason=missing-timestamp')
              raise SystemExit(1)

          age = (datetime.now(timezone.utc) - stamp).total_seconds()
          max_age = 8 * 60 * 60
          if age < 0 or age > max_age:
              print(
                  'STOCK_UPSTREAM_ABSOLUTE_FRESHNESS_FAIL',
                  f'ageMinutes={round(age / 60)}',
                  'maxHours=8',
                  f'source={stamp.isoformat()}',
              )
              raise SystemExit(1)

          print(
              'STOCK_UPSTREAM_ABSOLUTE_FRESHNESS_OK',
              f'ageMinutes={round(age / 60)}',
              f'source={stamp.isoformat()}',
          )
          PY

      - name: Repair and verify rolling Japanese with bounded alternate retries
        id: remote_repair
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          recovered=false
          for attempt in 1 2 3; do
            echo "ROLLING_EXHAUSTIVE_ATTEMPT attempt=${attempt}"
            python scripts/remote_repair_all_published_quality.py || true
            if python scripts/validate_extra_layers.py; then
              recovered=true
              break
            fi
            if [ "${attempt}" -lt 3 ]; then
              delay=$((attempt * 60))
              echo "ROLLING_EXHAUSTIVE_BACKOFF delay=${delay}s"
              sleep "${delay}"
            fi
          done
          if [ "${recovered}" != "true" ]; then
            echo "ROLLING_EXHAUSTIVE_EXHAUSTED"
            exit 1
          fi

      - name: Detect whether remote recovery advanced source freshness
        id: remote_freshness
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def stamp(payload):
              for key in ('generatedAt','lastUpdated','sourceGeneratedAt','checkedAt'):
                  value=payload.get(key) if isinstance(payload,dict) else None
                  if not value:
                      continue
                  try:
                      dt=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                      if dt.tzinfo is None:
                          dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except ValueError:
                      pass
              return None

          failures=[]
          for name in ('desk-latest.json','stocks-latest.json'):
              source_path=Path('.cantonese-snapshot/data') / name
              local_path=Path('data') / name
              source=json.loads(source_path.read_text(encoding='utf-8'))
              local=json.loads(local_path.read_text(encoding='utf-8'))
              source_ts=stamp(source)
              local_ts=stamp(local)
              if source_ts is None:
                  failures.append(f'{name}:source-timestamp-missing')
                  continue
              if local_ts is None or local_ts < source_ts:
                  failures.append(
                      f'{name}:local-stale source={source_ts.isoformat()} '
                      f'local={local_ts.isoformat() if local_ts else "missing"}'
                  )

          if failures:
              print('ROLLING_EXHAUSTIVE_OUTCOME_NOT_ACCEPTED')
              for failure in failures:
                  print(' -', failure)
              raise SystemExit(1)

          print('ROLLING_EXHAUSTIVE_OUTCOME_VERIFIED')
          PY
      - name: Cache independent local M2M100 model
        if: steps.remote_repair.outcome == 'failure' || steps.remote_freshness.outcome == 'failure'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-m2m100-418m-core-fallback-v1

      - name: Install independent local rolling recovery dependencies
        if: steps.remote_repair.outcome == 'failure' || steps.remote_freshness.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
          pip install -r requirements-translation.txt

      - name: Recover current rolling source through revalidated cache and local M2M100
        if: steps.remote_repair.outcome == 'failure' || steps.remote_freshness.outcome == 'failure'
        timeout-minutes: 16
        env:
          TOKENIZERS_PARALLELISM: 'false'
          EXTRA_EDITOR_LAYER_SCOPE: all
          EXTRA_DESK_STORIES_PER_DESK: '1'
          EXTRA_STOCK_STORIES_PER_TICKER: '1'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/secondary_local_rolling_recovery.py scripts/secondary_local_core_recovery.py
          python scripts/secondary_local_rolling_recovery.py

      - name: Validate every rolling topic and stock layer
        run: python scripts/validate_extra_layers.py

      - name: Reject any remaining degraded rolling metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          BAD={'EDITORIAL_MINIMUM_FALLBACK','TRANSLATION_FAILED','TRANSLATION_DEGRADED'}
          def stories(v):
              if isinstance(v, dict):
                  if v.get('id') and (v.get('title') or v.get('summary') or v.get('body')): yield v
                  for x in v.values(): yield from stories(x)
              elif isinstance(v, list):
                  for x in v: yield from stories(x)
          failures=[]
          paths=[Path('data/desk-latest.json'),Path('data/stocks-latest.json')]
          latest=json.loads(Path('data/latest.json').read_text(encoding='utf-8'))
          day=str(latest.get('date') or '')
          if day:
              current_topic=Path('data/topic-more') / f'{day}.json'
              if current_topic.exists():
                  paths.append(current_topic)
          for path in paths:
              if not path.exists(): continue
              data=json.loads(path.read_text(encoding='utf-8'))
              if data.get('translationDegraded'): failures.append(f'{path}:translationDegraded=true')
              if int(data.get('translationDeferredCount') or 0)>0:
                  failures.append(f'{path}:translationDeferredCount={data.get("translationDeferredCount")}')
              for item in stories(data):
                  status=str(item.get('translationStatus') or '').strip().upper()
                  if status in BAD: failures.append(f'{path}:{item.get("id")}:{status}')
          if failures:
              print('ROLLING_EXHAUSTIVE_DEGRADED_REJECT')
              for failure in failures[:80]: print(' -',failure)
              raise SystemExit(1)
          print('ROLLING_EXHAUSTIVE_NON_DEGRADED_PASS')
          PY

      - name: Require exhaustive recovery to advance current source freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def stamp(payload):
              for key in ('generatedAt','lastUpdated','sourceGeneratedAt','checkedAt'):
                  value=payload.get(key) if isinstance(payload,dict) else None
                  if not value:
                      continue
                  try:
                      dt=datetime.fromisoformat(str(value).replace('Z','+00:00'))
                      if dt.tzinfo is None:
                          dt=dt.replace(tzinfo=timezone.utc)
                      return dt.astimezone(timezone.utc)
                  except ValueError:
                      pass
              return None

          failures=[]
          for name in ('desk-latest.json','stocks-latest.json'):
              source_path=Path('.cantonese-snapshot/data') / name
              local_path=Path('data') / name
              source=json.loads(source_path.read_text(encoding='utf-8'))
              local=json.loads(local_path.read_text(encoding='utf-8'))
              source_ts=stamp(source)
              local_ts=stamp(local)
              if source_ts is None:
                  failures.append(f'{name}:source-timestamp-missing')
                  continue
              if local_ts is None or local_ts < source_ts:
                  failures.append(
                      f'{name}:local-stale source={source_ts.isoformat()} '
                      f'local={local_ts.isoformat() if local_ts else "missing"}'
                  )

          if failures:
              print('ROLLING_EXHAUSTIVE_OUTCOME_NOT_ACCEPTED')
              for failure in failures:
                  print(' -', failure)
              raise SystemExit(1)

          print('ROLLING_EXHAUSTIVE_OUTCOME_VERIFIED')
          PY
      - name: Publish repaired rolling Japanese immediately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'daily-brief-japanese-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/desk-latest.json data/stocks-latest.json data/topic-more data/translation-cache.json
          if git diff --cached --quiet; then
            echo 'No rolling Japanese quality repair required.'
            exit 0
          fi
          git commit -m '全ローリング日本語の文字化け・意味不一致・自然さを修復'
          git stash push -u -m "rolling-exhaustive-residual-${GITHUB_RUN_ID}" >/dev/null 2>&1 || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'FULL_ROLLING_JAPANESE_QUALITY_REPAIR_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

