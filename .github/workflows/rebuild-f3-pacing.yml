name: F3ニュース読み再生成

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - '日本語ニュース同期・Discord即時配信'
      - '日本語ローリング翻訳品質修復'
    types: [completed]
  schedule:
    # Safety net: if an upstream workflow_run event is ever missed, make sure
    # stale F3 audio is revisited every hour after the Japanese xx:15 cycle.
    - cron: '35 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/generate_supertonic_f3.py'
      - 'scripts/generate_supertonic_f3_chunked.py'
      - 'scripts/generate_supertonic_f3_rolling.py'
      - 'scripts/generate_supertonic_f3_rolling_chunked.py'
      - 'scripts/validate_site.py'
      - 'scripts/validate_content_integrity.py'
      - '.github/workflows/rebuild-f3-pacing.yml'

permissions:
  contents: write

concurrency:
  group: f3-semantic-pacing-rebuild
  # Voice generation can take long enough to overlap the next upstream event.
  # Cancelling here discards all uncommitted audio progress, which caused the
  # Aug 26 run to die with 19 records pending. Serialize instead; a queued run
  # will re-check the manifest and normally become a small/no-op catch-up run.
  cancel-in-progress: false

jobs:
  rebuild:
    # A failed upstream sync must not synthesize a rejected/partial publication.
    # Manual, schedule and direct F3-code pushes remain eligible immediately.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      F3_RECORD_BATCH_SIZE: '3'
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 5

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: FFmpegを準備
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: F3小分け生成スクリプトを構文検査
        run: python -m py_compile scripts/generate_supertonic_f3.py scripts/generate_supertonic_f3_chunked.py scripts/generate_supertonic_f3_rolling.py scripts/generate_supertonic_f3_rolling_chunked.py

      - name: 音声生成前に日本語コンテンツ完全性を検証
        run: python scripts/validate_content_integrity.py

      - name: Daily・速報F3を3記事ずつ意味区切り生成
        run: python scripts/generate_supertonic_f3_chunked.py

      - name: Rolling・分野F3を3記事ずつ意味区切り生成
        run: python scripts/generate_supertonic_f3_rolling_chunked.py

      - name: 音声・速度・意味区切りQA
        run: python scripts/validate_site.py --data-only

      - name: JavaScript構文チェック
        run: |
          node --check assets/js/newspaper-ja.js
          node --check assets/js/system-ja.js
          node --check assets/js/live-guard.js

      - name: 生成物をmainへ保存
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'japanese-voice-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data audio
          if git diff --cached --quiet; then
            echo 'F3 pacing output is already current.'
            exit 0
          fi
          git commit -m 'F3日本語ニュース読みを小分け意味区切りで更新'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'F3_PACING_PUSH_OK batch_size=3'
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo 'F3 pacing output could not push after retries.' >&2
          exit 1
