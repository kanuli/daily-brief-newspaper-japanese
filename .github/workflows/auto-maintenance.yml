name: Japanese Site Auto Maintenance

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-translation.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-translation.txt'
      - '.github/workflows/**'
  workflow_run:
    workflows:
      - '日本語ニュース同期・Discord即時配信'
      - '日本語ローリング翻訳品質修復'
      - '日本語版 Pages 公開・広東語版レイアウト同期'
      - 'F3ニュース読み再生成'
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: japanese-site-auto-maintenance
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Prepare minimal Python dependencies for maintenance QA
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0

      - name: Verify maintenance scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate_site.py \
            scripts/validate_layout_parity.py \
            scripts/auto_repair_site.py \
            scripts/check_source_drift.py \
            scripts/validate_content_integrity.py \
            scripts/validate_extra_layers.py \
            scripts/validate_furigana_readings.py

      - name: Deterministic static repair
        run: python scripts/auto_repair_site.py

      - name: Static QA for Cantonese-layout parity
        id: static_qa
        shell: bash
        run: |
          set -euo pipefail
          check_static() {
            python scripts/validate_site.py --static-only && \
            python scripts/validate_layout_parity.py && \
            node --check assets/js/newspaper-ja.js && \
            node --check assets/js/system-ja.js && \
            node --check assets/js/live-guard.js && \
            node --check assets/js/home-extras-ja.js && \
            node --check assets/js/live-article-ja.js && \
            node --check assets/js/topic-ja-rolling.js && \
            node --check assets/js/stocks-ja.js
          }
          if check_static; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
            echo 'recovered=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/auto_repair_site.py
          if check_static; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
            echo 'recovered=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'healthy=false' >> "$GITHUB_OUTPUT"
          exit 1

      - name: Save automatic static repairs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'japanese-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html' assets
          if git diff --cached --quiet; then
            echo 'No static repair commit required.'
            exit 0
          fi
          git commit -m 'Auto-repair Japanese site static health'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo 'STATIC_AUTO_REPAIR_PUSH_OK'
              exit 0
            fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1

      - name: Check Japanese publication text/data only
        id: publication_qa
        shell: bash
        run: |
          set +e
          python scripts/validate_content_integrity.py
          a=$?
          python scripts/validate_extra_layers.py
          b=$?
          python scripts/validate_furigana_readings.py
          c=$?
          set -e

          if [ "$a" -eq 0 ]; then
            echo 'core_healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'core_healthy=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$b" -eq 0 ]; then
            echo 'extra_healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'extra_healthy=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$c" -eq 0 ]; then
            echo 'furigana_healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'furigana_healthy=false' >> "$GITHUB_OUTPUT"
          fi

          if [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ]; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Compare current Cantonese source fingerprints
        id: drift
        shell: bash
        run: |
          set +e
          python scripts/check_source_drift.py
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 10 ]; then
            echo 'drift=true' >> "$GITHUB_OUTPUT"
          else
            echo 'drift=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check F3 voice independently
        id: audio_qa
        shell: bash
        run: |
          if [ "${{ steps.publication_qa.outputs.healthy }}" != 'true' ]; then
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            echo 'Publication data is not clean yet; F3 check deferred.'
            exit 0
          fi
          set +e
          python scripts/validate_site.py --data-only
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi
          last_data_epoch=$(git log -1 --format=%ct -- data/latest.json data/live.json 2>/dev/null || echo 0)
          now_epoch=$(date +%s)
          if [ "${last_data_epoch:-0}" -gt 0 ]; then
            age=$((now_epoch-last_data_epoch))
          else
            age=999999
          fi
          echo "data_age=${age}" >> "$GITHUB_OUTPUT"

      - name: Inspect translation, repair, Pages and F3 workers
        id: workers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow sync-japanese-news.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,headSha > /tmp/sync.json
          gh run list --workflow repair-extra-translation-quality.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,headSha > /tmp/repair.json
          gh run list --workflow pages.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,headSha > /tmp/pages.json
          gh run list --workflow rebuild-f3-pacing.yml --branch main --limit 20 --json status,conclusion,databaseId,createdAt,headSha > /tmp/f3.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          def emit(path, prefix):
              runs = json.load(open(path, encoding='utf-8'))
              active = [r for r in runs if r.get('status') != 'completed']
              ages = []
              for r in active:
                  try:
                      ages.append(max(0, int((now-datetime.fromisoformat(r['createdAt'].replace('Z','+00:00'))).total_seconds())))
                  except Exception:
                      pass
              latest = runs[0] if runs else {}
              streak = 0
              for r in runs:
                  if r.get('status') != 'completed':
                      continue
                  if r.get('conclusion') in {'failure', 'cancelled', 'timed_out', 'action_required'}:
                      streak += 1
                  else:
                      break
              print(f'{prefix}_active_count={len(active)}')
              print(f'{prefix}_active_ids={",".join(str(r.get("databaseId")) for r in active if r.get("databaseId"))}')
              print(f'{prefix}_active_oldest={max(ages) if ages else 0}')
              print(f'{prefix}_latest_conclusion={latest.get("conclusion") or ""}')
              print(f'{prefix}_latest_head={latest.get("headSha") or ""}')
              print(f'{prefix}_failure_streak={streak}')
          emit('/tmp/sync.json','sync')
          emit('/tmp/repair.json','repair')
          emit('/tmp/pages.json','pages')
          emit('/tmp/f3.json','f3')
          PY

      - name: Recover Japanese core text/data sync
        if: github.event_name != 'pull_request' && (steps.publication_qa.outputs.core_healthy != 'true' || steps.publication_qa.outputs.furigana_healthy != 'true' || steps.drift.outputs.drift == 'true' || steps.workers.outputs.sync_latest_conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.workers.outputs.sync_active_count }}
          ACTIVE_OLDEST: ${{ steps.workers.outputs.sync_active_oldest }}
          LATEST_CONCLUSION: ${{ steps.workers.outputs.sync_latest_conclusion }}
          LATEST_HEAD: ${{ steps.workers.outputs.sync_latest_head }}
          FAILURE_STREAK: ${{ steps.workers.outputs.sync_failure_streak }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          main_sha=$(git rev-parse origin/main)

          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            current_active=0
            while IFS=$'\t' read -r run_id head_sha; do
              [ -n "${run_id:-}" ] || continue
              if [ "$head_sha" = "$main_sha" ] && [ "${ACTIVE_OLDEST:-0}" -lt 3300 ]; then
                current_active=1
                continue
              fi
              echo "Cancelling obsolete Japanese sync run ${run_id} head=${head_sha} current=${main_sha}"
              gh run cancel "$run_id" --repo "${{ github.repository }}" || true
            done < <(gh run list --workflow sync-japanese-news.yml --branch main --limit 20 --json status,databaseId,headSha --jq '.[] | select(.status != "completed") | [.databaseId,.headSha] | @tsv')

            if [ "$current_active" -eq 1 ]; then
              echo 'A current-main Japanese text/data sync is already active.'
              exit 0
            fi
            sleep 3
          fi

          if [ "${LATEST_CONCLUSION:-}" = 'failure' ] && [ "${LATEST_HEAD:-}" = "$main_sha" ] && [ "${FAILURE_STREAK:-0}" -ge 2 ]; then
            echo 'Two consecutive sync failures on the same production head; automatic redispatch paused to avoid a failure loop.'
            exit 0
          fi

          gh workflow run sync-japanese-news.yml --repo "${{ github.repository }}" --ref main
          echo "JAPANESE_TEXT_SYNC_RECOVERY_DISPATCHED main=${main_sha}"

      - name: Recover rolling translation quality independently
        if: github.event_name != 'pull_request' && (steps.publication_qa.outputs.extra_healthy != 'true' || steps.workers.outputs.repair_latest_conclusion == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.workers.outputs.repair_active_count }}
          LATEST_CONCLUSION: ${{ steps.workers.outputs.repair_latest_conclusion }}
          LATEST_HEAD: ${{ steps.workers.outputs.repair_latest_head }}
          FAILURE_STREAK: ${{ steps.workers.outputs.repair_failure_streak }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          main_sha=$(git rev-parse origin/main)

          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            echo 'Rolling translation repair worker is already active.'
            exit 0
          fi

          if [ "${LATEST_CONCLUSION:-}" = 'failure' ] && [ "${LATEST_HEAD:-}" = "$main_sha" ] && [ "${FAILURE_STREAK:-0}" -ge 2 ]; then
            echo 'Two consecutive rolling-repair failures on the same production head; automatic redispatch paused to avoid a failure loop.'
            exit 0
          fi

          gh workflow run repair-extra-translation-quality.yml --repo "${{ github.repository }}" --ref main
          echo "ROLLING_TRANSLATION_REPAIR_DISPATCHED main=${main_sha}"

      - name: Recover F3 voice separately after server grace period
        if: github.event_name != 'pull_request' && steps.publication_qa.outputs.healthy == 'true' && steps.drift.outputs.drift != 'true' && steps.audio_qa.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.workers.outputs.f3_active_count }}
          DATA_AGE: ${{ steps.audio_qa.outputs.data_age }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            echo 'F3 worker is already active.'
            exit 0
          fi
          if [ "${DATA_AGE:-0}" -lt 1200 ]; then
            echo 'Giving the production server F3 worker 20 minutes to finish.'
            exit 0
          fi
          gh workflow run rebuild-f3-pacing.yml --repo "${{ github.repository }}" --ref main
          echo 'F3_FALLBACK_RECOVERY_DISPATCHED'

      - name: Recover GitHub Pages independently
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_COUNT: ${{ steps.workers.outputs.pages_active_count }}
          LATEST_CONCLUSION: ${{ steps.workers.outputs.pages_latest_conclusion }}
          LATEST_HEAD: ${{ steps.workers.outputs.pages_latest_head }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          main_sha=$(git rev-parse origin/main)
          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            echo 'Pages deployment is already active.'
            exit 0
          fi
          if [ "${LATEST_CONCLUSION:-}" = 'success' ] && [ "${LATEST_HEAD:-}" = "$main_sha" ]; then
            echo 'Pages already matches current main.'
            exit 0
          fi
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "PAGES_RECOVERY_DISPATCHED main=${main_sha}"

      - name: Refresh last-known-good only after full health
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.static_qa.outputs.healthy }}" != 'true' ] || \
             [ "${{ steps.publication_qa.outputs.healthy }}" != 'true' ] || \
             [ "${{ steps.drift.outputs.drift }}" = 'true' ] || \
             [ "${{ steps.audio_qa.outputs.healthy }}" != 'true' ]; then
            echo 'Full production health not reached; known-good reference not advanced.'
            exit 0
          fi
          git fetch -q origin main
          sha=$(git rev-parse origin/main)
          git push --force origin "$sha:refs/heads/maintenance-known-good"
          echo "KNOWN_GOOD_REFRESHED ${sha}"

      - name: Maintenance summary
        if: always()
        run: |
          echo "Static healthy: ${{ steps.static_qa.outputs.healthy || 'false' }}"
          echo "Publication text/data healthy: ${{ steps.publication_qa.outputs.healthy || 'false' }}"
          echo "Core publication healthy: ${{ steps.publication_qa.outputs.core_healthy || 'false' }}"
          echo "Rolling translation healthy: ${{ steps.publication_qa.outputs.extra_healthy || 'false' }}"
          echo "Furigana healthy: ${{ steps.publication_qa.outputs.furigana_healthy || 'false' }}"
          echo "Cantonese source drift: ${{ steps.drift.outputs.drift || 'unknown' }}"
          echo "F3 voice healthy: ${{ steps.audio_qa.outputs.healthy || 'false' }}"
          echo "Sync active: ${{ steps.workers.outputs.sync_active_count || '0' }}"
          echo "Rolling repair active: ${{ steps.workers.outputs.repair_active_count || '0' }}"
          echo "Pages active: ${{ steps.workers.outputs.pages_active_count || '0' }}"
          echo "F3 active: ${{ steps.workers.outputs.f3_active_count || '0' }}"
          echo "Latest sync conclusion: ${{ steps.workers.outputs.sync_latest_conclusion || 'unknown' }}"
          echo "Latest rolling repair conclusion: ${{ steps.workers.outputs.repair_latest_conclusion || 'unknown' }}"
          echo 'Japanese site maintenance cycle completed.'

      - name: Enforce truthful production-health status
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          unhealthy=0

          if [ "${{ steps.static_qa.outputs.healthy }}" != 'true' ]; then
            echo '::error::Static Japanese site QA is not healthy.'
            unhealthy=1
          fi
          if [ "${{ steps.publication_qa.outputs.healthy }}" != 'true' ]; then
            echo '::error::Japanese publication data is not healthy; recovery may be active or pending.'
            unhealthy=1
          fi
          if [ "${{ steps.drift.outputs.drift }}" = 'true' ]; then
            echo '::error::Japanese publication is behind the current Cantonese source.'
            unhealthy=1
          fi
          if [ "${{ steps.audio_qa.outputs.healthy }}" != 'true' ]; then
            echo '::error::F3 production audio is not healthy or is still awaiting recovery.'
            unhealthy=1
          fi

          for state in \
            "${{ steps.workers.outputs.sync_latest_conclusion }}" \
            "${{ steps.workers.outputs.repair_latest_conclusion }}" \
            "${{ steps.workers.outputs.pages_latest_conclusion }}" \
            "${{ steps.workers.outputs.f3_latest_conclusion }}"; do
            case "$state" in
              failure|cancelled|timed_out|action_required)
                echo "::error::A supervised production workflow last ended as ${state}."
                unhealthy=1
                ;;
            esac
          done

          if [ "$unhealthy" -ne 0 ]; then
            echo 'AUTO_MAINTENANCE_UNRESOLVED_HEALTH_FAILURE'
            exit 1
          fi

          echo 'AUTO_MAINTENANCE_PRODUCTION_HEALTH_OK'
