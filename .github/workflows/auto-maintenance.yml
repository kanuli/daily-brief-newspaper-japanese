name: Japanese Site Auto Maintenance

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-translation.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'scripts/**'
      - 'requirements.txt'
      - 'requirements-translation.txt'
      - '.github/workflows/**'
  workflow_run:
    workflows:
      - '日本語ニュース同期・品質ゲート・Discord配信'
      - '日本語ローリング翻訳品質修復'
      - '日本語版 Pages 公開・広東語版レイアウト同期'
      - 'F3ニュース読み再生成'
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: japanese-site-auto-maintenance
  cancel-in-progress: false

env:
  F3_RECOVERY_COOLDOWN_SECONDS: '1200'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40

      - name: Prepare minimal maintenance dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet \
            requests==2.32.5 \
            deep-translator==1.11.4 \
            pykakasi==2.3.0

      - name: Verify maintenance scripts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validate_site.py \
            scripts/validate_layout_parity.py \
            scripts/auto_repair_site.py \
            scripts/validate_content_integrity.py \
            scripts/validate_extra_layers.py \
            scripts/validate_furigana_readings.py

      - name: Deterministic static repair
        run: python scripts/auto_repair_site.py

      - name: Static QA for Cantonese-layout parity
        id: static_qa
        shell: bash
        run: |
          set +e
          python scripts/validate_site.py --static-only
          a=$?
          python scripts/validate_layout_parity.py
          b=$?
          node --check assets/js/newspaper-ja.js
          c=$?
          node --check assets/js/system-ja.js
          d=$?
          node --check assets/js/live-guard.js
          e=$?
          node --check assets/js/home-current-ja.js
          f=$?
          node --check assets/js/topic-ja-rolling.js
          g=$?
          node --check assets/js/stocks-ja.js
          h=$?
          set -e
          if [ "$a" -eq 0 ] && [ "$b" -eq 0 ] && [ "$c" -eq 0 ] && [ "$d" -eq 0 ] && \
             [ "$e" -eq 0 ] && [ "$f" -eq 0 ] && [ "$g" -eq 0 ] && [ "$h" -eq 0 ]; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Save deterministic static repairs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'japanese-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '*.html' assets
          if git diff --cached --quiet; then
            echo 'No static repair commit required.'
            exit 0
          fi
          git commit -m 'Auto-repair Japanese site static health'
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              sleep $((attempt * 2))
              continue
            fi
            if git push origin HEAD:main; then
              echo 'STATIC_AUTO_REPAIR_PUSH_OK'
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Check local publication quality
        id: publication_qa
        shell: bash
        run: |
          set +e
          python scripts/validate_content_integrity.py
          a=$?
          python scripts/validate_extra_layers.py
          b=$?
          python scripts/validate_furigana_readings.py
          c=$?
          set -e
          [ "$a" -eq 0 ] && echo 'core_healthy=true' >> "$GITHUB_OUTPUT" || echo 'core_healthy=false' >> "$GITHUB_OUTPUT"
          [ "$b" -eq 0 ] && echo 'extra_healthy=true' >> "$GITHUB_OUTPUT" || echo 'extra_healthy=false' >> "$GITHUB_OUTPUT"
          [ "$c" -eq 0 ] && echo 'furigana_healthy=true' >> "$GITHUB_OUTPUT" || echo 'furigana_healthy=false' >> "$GITHUB_OUTPUT"

      - name: Read authoritative current-main newsroom health
        id: newsroom
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          git show origin/main:data/newsroom-health.json > /tmp/newsroom-health.json || true
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('/tmp/newsroom-health.json')
          try:
              health = json.loads(path.read_text(encoding='utf-8'))
          except Exception:
              health = {}

          def yes(value):
              return 'true' if value is True else 'false'

          assessed = health.get('assessedAt')
          try:
              dt = datetime.fromisoformat(str(assessed).replace('Z', '+00:00'))
              age = max(0, int((datetime.now(timezone.utc) - dt).total_seconds()))
          except Exception:
              age = 999999

          layers = health.get('layers') or {}
          core_current = (layers.get('daily') or {}).get('current') is True and (layers.get('live') or {}).get('current') is True
          rolling_current = (layers.get('desk') or {}).get('current') is True and (layers.get('stocks') or {}).get('current') is True
          structural_current = (layers.get('structural') or {}).get('current') is True
          fresh = age <= 50 * 60
          green = health.get('state') == 'GREEN' and fresh and core_current and rolling_current and structural_current

          print(f'fresh={yes(fresh)}')
          print(f'green={yes(green)}')
          print(f'core_current={yes(core_current)}')
          print(f'rolling_current={yes(rolling_current)}')
          print(f'structural_current={yes(structural_current)}')
          print(f'age_seconds={age}')
          print(f'state={health.get("state") or "MISSING"}')
          print(f'summary={health.get("summary") or "MISSING"}')
          PY

      - name: Report publication diagnostics without dispatching news recovery
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "Local core QA: ${{ steps.publication_qa.outputs.core_healthy || 'false' }}"
          echo "Local rolling QA: ${{ steps.publication_qa.outputs.extra_healthy || 'false' }}"
          echo "Local furigana QA: ${{ steps.publication_qa.outputs.furigana_healthy || 'false' }}"
          echo "Authoritative newsroom state: ${{ steps.newsroom.outputs.state || 'MISSING' }}"
          echo "Authoritative newsroom summary: ${{ steps.newsroom.outputs.summary || 'MISSING' }}"
          echo "Authoritative rolling current: ${{ steps.newsroom.outputs.rolling_current || 'false' }}"
          echo 'Core/Rolling recovery dispatch is intentionally owned only by the Editor-in-Chief Newsroom Robot.'

      - name: Check F3 voice independently
        id: audio_qa
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ "${{ steps.newsroom.outputs.core_current }}" != 'true' ] || [ "${{ steps.publication_qa.outputs.furigana_healthy }}" != 'true' ]; then
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
            echo 'Core publication is not ready; F3 check deferred.'
            exit 0
          fi
          set +e
          python scripts/validate_site.py --data-only
          code=$?
          set -e
          [ "$code" -eq 0 ] && echo 'healthy=true' >> "$GITHUB_OUTPUT" || echo 'healthy=false' >> "$GITHUB_OUTPUT"

      - name: Recover F3 voice only after bounded cooldown
        id: f3_recovery
        if: github.event_name != 'pull_request' && steps.newsroom.outputs.core_current == 'true' && steps.publication_qa.outputs.furigana_healthy == 'true' && steps.audio_qa.outputs.healthy != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          active=$(gh run list --workflow rebuild-f3-pacing.yml --branch main --limit 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "${active:-0}" -gt 0 ]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo 'F3 worker is already active.'
            exit 0
          fi
          latest_created=$(gh run list --workflow rebuild-f3-pacing.yml --branch main --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          age=$(python - "$latest_created" <<'PY'
          from datetime import datetime, timezone
          import sys
          try:
              dt = datetime.fromisoformat(sys.argv[1].replace('Z', '+00:00'))
              print(max(0, int((datetime.now(timezone.utc)-dt).total_seconds())))
          except Exception:
              print(999999)
          PY
          )
          if [ "$age" -lt "${F3_RECOVERY_COOLDOWN_SECONDS}" ]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo "F3 cooldown active (${age}s)."
            exit 0
          fi
          gh workflow run rebuild-f3-pacing.yml --repo "${{ github.repository }}" --ref main
          echo 'pending=true' >> "$GITHUB_OUTPUT"
          echo 'F3_FALLBACK_RECOVERY_DISPATCHED'

      - name: Refresh last-known-good after authoritative GREEN
        if: github.event_name != 'pull_request' && steps.static_qa.outputs.healthy == 'true' && steps.newsroom.outputs.green == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch -q origin main
          sha=$(git rev-parse origin/main)
          git push --force origin "$sha:refs/heads/maintenance-known-good"
          echo "KNOWN_GOOD_REFRESHED ${sha}"

      - name: Maintenance summary
        if: always()
        run: |
          echo "Static healthy: ${{ steps.static_qa.outputs.healthy || 'false' }}"
          echo "Newsroom fresh: ${{ steps.newsroom.outputs.fresh || 'false' }}"
          echo "Newsroom GREEN: ${{ steps.newsroom.outputs.green || 'false' }}"
          echo "Newsroom core current: ${{ steps.newsroom.outputs.core_current || 'false' }}"
          echo "Newsroom rolling current: ${{ steps.newsroom.outputs.rolling_current || 'false' }}"
          echo "F3 voice healthy: ${{ steps.audio_qa.outputs.healthy || 'false' }}"
          echo "F3 recovery pending: ${{ steps.f3_recovery.outputs.pending || 'false' }}"
          echo 'No Core/Rolling workflow is dispatched from Auto Maintenance.'

      - name: Enforce truthful reader-facing health
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.static_qa.outputs.healthy }}" != 'true' ]; then
            echo '::error::Static Japanese site QA is not healthy.'
            exit 1
          fi
          if [ "${{ steps.newsroom.outputs.green }}" != 'true' ]; then
            echo "::error::Reader-facing newsroom health is not GREEN: ${{ steps.newsroom.outputs.summary || 'MISSING' }}"
            echo 'The Editor-in-Chief Recovery Recheck Bridge will re-run the authoritative robot after this maintenance cycle completes.'
            exit 1
          fi
          if [ "${{ steps.audio_qa.outputs.healthy }}" != 'true' ]; then
            echo '::warning::News is GREEN; F3 audio remains an independent recovery domain.'
          fi
          echo 'AUTO_MAINTENANCE_READER_HEALTH_GREEN'
