name: Discord Japanese Article Link Test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/discord-link-test.yml"

permissions:
  contents: write

jobs:
  test-discord-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send article-link test and write proof
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import pathlib
          import os
          import urllib.request

          data = json.loads(pathlib.Path("data/latest.json").read_text(encoding="utf-8"))
          articles = {a.get("id"): a for a in data.get("articles", [])}
          chosen = None
          for article_id in data.get("topFive", []):
              article = articles.get(article_id)
              if article and article.get("title") and article.get("sourceUrl"):
                  chosen = article
                  break
          if not chosen:
              raise RuntimeError("No current Daily article with sourceUrl found for Discord link test")

          content = (
              "🧪 **日本語ニュース 記事リンクテスト**\n\n"
              f"**{chosen['title']}**\n"
              f"🔗 記事リンク：{chosen['sourceUrl']}\n\n"
              "✅ このURLが表示されれば、今後のニュース配信にも記事リンクが付きます。"
          )
          body = json.dumps({"content": content, "allowed_mentions": {"parse": []}}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"].strip(),
              data=body,
              headers={"Content-Type": "application/json", "User-Agent": "JapaneseDailyBriefLinkTest/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status not in (200, 204):
                  raise RuntimeError(f"Discord webhook returned HTTP {response.status}")
              print(f"Discord accepted article-link test: HTTP {response.status}")
          PY

          printf 'Discord article-link test succeeded at %s\nCommit: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$GITHUB_SHA" > discord-link-test-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add discord-link-test-success.txt
          git commit -m "Record successful Discord article-link test"
          git push
