name: 日本語ニュース総編集公開SLAウォッチドッグ

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/hourly-update-watchdog.yml'
  schedule:
    # Primary recovery check 10 minutes after the normal :15 sync.
    - cron: '25 * * * *'
    # Hard publication SLA check 25 minutes after the normal :15 sync.
    - cron: '40 * * * *'

permissions:
  actions: write
  contents: read

concurrency:
  group: japanese-news-hourly-watchdog
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Daily・Live毎時公開実績を確認
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const deliveryStepNames = new Set([
              '変更ありの毎時15分版をDiscordへ配信',
              '変更なしでも定時xx:15のDiscordサイト更新を配信',
              '緊急復旧版をDiscordへ配信',
              '緊急復旧でも変更なしなら定時xx:15サイト更新を配信',
            ]);

            const { owner, repo } = context.repo;
            const now = new Date();
            const expected = new Date(now);
            expected.setUTCMinutes(15, 0, 0);
            if (now.getTime() < expected.getTime()) {
              expected.setUTCHours(expected.getUTCHours() - 1);
            }
            const cutoff = expected.getTime() - 2 * 60 * 1000;
            const isSecondCheck = context.eventName === 'schedule' && context.payload.schedule === '40 * * * *';

            async function readJson(repoOwner, repoName, path) {
              const response = await github.rest.repos.getContent({
                owner: repoOwner,
                repo: repoName,
                path,
                ref: 'main',
              });
              if (Array.isArray(response.data) || !response.data.content) {
                throw new Error(`Expected file content for ${repoOwner}/${repoName}/${path}`);
              }
              return JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            }

            function dayMs(value) {
              const text = String(value || '').slice(0, 10);
              const stamp = Date.parse(`${text}T00:00:00Z`);
              return Number.isFinite(stamp) ? stamp : NaN;
            }

            // Editorial truth comes from published newsroom payloads, not workflow green lights.
            const [upstreamLive, japaneseLive, upstreamDaily, japaneseDaily] = await Promise.all([
              readJson('kanuli', 'daily-brief-newspaper', 'data/live.json'),
              readJson(owner, repo, 'data/live.json'),
              readJson('kanuli', 'daily-brief-newspaper', 'data/latest.json'),
              readJson(owner, repo, 'data/latest.json'),
            ]);

            const upstreamLiveMs = Date.parse(upstreamLive.lastUpdated || '');
            const japaneseLiveMs = Date.parse(japaneseLive.lastUpdated || '');
            if (!Number.isFinite(upstreamLiveMs) || !Number.isFinite(japaneseLiveMs)) {
              throw new Error(`Invalid live timestamps: upstream=${upstreamLive.lastUpdated}, japanese=${japaneseLive.lastUpdated}`);
            }

            const upstreamDailyMs = dayMs(upstreamDaily.date);
            const japaneseDailyMs = dayMs(japaneseDaily.date);
            if (!Number.isFinite(upstreamDailyMs) || !Number.isFinite(japaneseDailyMs)) {
              throw new Error(`Invalid Daily dates: upstream=${upstreamDaily.date}, japanese=${japaneseDaily.date}`);
            }

            const liveAhead = upstreamLiveMs > japaneseLiveMs + 60 * 1000;
            const liveLagMinutes = Math.max(0, Math.floor((upstreamLiveMs - japaneseLiveMs) / 60000));
            const dailyAhead = upstreamDailyMs > japaneseDailyMs;
            const dailyLagDays = Math.max(0, Math.floor((upstreamDailyMs - japaneseDailyMs) / 86400000));

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'sync-japanese-news.yml',
              per_page: 30,
            });
            const candidates = runsResponse.data.workflow_runs.filter((run) => {
              const created = new Date(run.created_at).getTime();
              return created >= cutoff && created <= now.getTime();
            });

            let deliveryOk = false;
            let activeSync = false;
            let freshActiveSync = false;
            for (const run of candidates.slice(0, 10)) {
              if (run.status !== 'completed') {
                activeSync = true;
                const ageMinutes = (now.getTime() - new Date(run.created_at).getTime()) / 60000;
                if (ageMinutes < 18) freshActiveSync = true;
              }
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, per_page: 100 }
              );
              for (const job of jobs) {
                for (const step of job.steps || []) {
                  if (deliveryStepNames.has(step.name) && step.conclusion === 'success') deliveryOk = true;
                }
              }
            }

            let priorFallback = false;
            if (isSecondCheck) {
              const watchdogRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'hourly-update-watchdog.yml',
                event: 'schedule',
                per_page: 20,
              });
              const priorRuns = watchdogRuns.data.workflow_runs.filter((run) => {
                if (run.id === context.runId) return false;
                const created = new Date(run.created_at).getTime();
                return created >= cutoff && created < now.getTime();
              });
              for (const run of priorRuns.slice(0, 5)) {
                const jobs = await github.paginate(
                  github.rest.actions.listJobsForWorkflowRun,
                  { owner, repo, run_id: run.id, per_page: 100 }
                );
                if (jobs.some((job) => (job.steps || []).some((step) =>
                  step.name === '最後の承認済み版をDiscordへ安全配信' && step.conclusion === 'success'
                ))) {
                  priorFallback = true;
                  break;
                }
              }
            }

            const scheduledCycleMissing = candidates.length === 0;
            const publicationLag = liveAhead || dailyAhead;
            const fallback = !deliveryOk && !priorFallback;

            // :25 allows only a genuinely fresh in-flight translation. :40 is the hard SLA.
            const recovery = scheduledCycleMissing ||
              (publicationLag && (!freshActiveSync || isSecondCheck));
            const slaBreach = isSecondCheck && publicationLag;

            core.info(`Expected hourly slot: ${expected.toISOString()}`);
            core.info(`Upstream Daily=${upstreamDaily.date}; Japanese Daily=${japaneseDaily.date}; lag_days=${dailyLagDays}; behind=${dailyAhead}`);
            core.info(`Upstream Live=${upstreamLive.lastUpdated}; Japanese Live=${japaneseLive.lastUpdated}; lag_minutes=${liveLagMinutes}; behind=${liveAhead}`);
            core.info(`Candidate sync runs: ${candidates.length}`);
            core.info(`Active sync exists: ${activeSync}; fresh active sync: ${freshActiveSync}`);
            core.info(`Discord delivery confirmed: ${deliveryOk}`);
            core.info(`Scheduled cycle missing: ${scheduledCycleMissing}`);
            core.info(`Recovery required: ${recovery}`);
            core.info(`Publication SLA breach: ${slaBreach}`);

            core.setOutput('fallback', fallback ? 'true' : 'false');
            core.setOutput('recovery', recovery ? 'true' : 'false');
            core.setOutput('publication_lag', publicationLag ? 'true' : 'false');
            core.setOutput('live_lag_minutes', String(liveLagMinutes));
            core.setOutput('daily_lag_days', String(dailyLagDays));
            core.setOutput('daily_behind', dailyAhead ? 'true' : 'false');
            core.setOutput('live_behind', liveAhead ? 'true' : 'false');
            core.setOutput('sla_breach', slaBreach ? 'true' : 'false');
            core.setOutput('upstream_daily', String(upstreamDaily.date || 'N/V'));
            core.setOutput('japanese_daily', String(japaneseDaily.date || 'N/V'));
            core.setOutput('upstream_live', String(upstreamLive.lastUpdated || 'N/V'));
            core.setOutput('japanese_live', String(japaneseLive.lastUpdated || 'N/V'));

      - name: production mainを取得
        if: steps.inspect.outputs.fallback == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: 最後の承認済み版をDiscordへ安全配信
        if: steps.inspect.outputs.fallback == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/notify_discord.py --hourly

      - name: 欠落・失敗・遅延した毎時同期を再起動
        if: steps.inspect.outputs.recovery == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'sync-japanese-news.yml',
              ref: 'main',
            });
            core.info('Dispatched sync-japanese-news.yml recovery run on main.');

      - name: Daily・Live公開SLA違反を明示
        if: steps.inspect.outputs.sla_breach == 'true'
        shell: bash
        run: |
          echo "::error::Japanese newsroom publication is still behind upstream after the hard hourly deadline."
          echo "Daily upstream=${{ steps.inspect.outputs.upstream_daily }} Japanese=${{ steps.inspect.outputs.japanese_daily }} lag_days=${{ steps.inspect.outputs.daily_lag_days }}"
          echo "Live upstream=${{ steps.inspect.outputs.upstream_live }} Japanese=${{ steps.inspect.outputs.japanese_live }} lag_minutes=${{ steps.inspect.outputs.live_lag_minutes }}"
          exit 1

      - name: 総編集ウォッチドッグ結果
        if: always()
        shell: bash
        run: |
          echo "fallback=${{ steps.inspect.outputs.fallback }}"
          echo "recovery=${{ steps.inspect.outputs.recovery }}"
          echo "publication_lag=${{ steps.inspect.outputs.publication_lag }}"
          echo "daily_behind=${{ steps.inspect.outputs.daily_behind }}"
          echo "daily_lag_days=${{ steps.inspect.outputs.daily_lag_days }}"
          echo "live_behind=${{ steps.inspect.outputs.live_behind }}"
          echo "live_lag_minutes=${{ steps.inspect.outputs.live_lag_minutes }}"
          echo "sla_breach=${{ steps.inspect.outputs.sla_breach }}"
