name: Editor-in-Chief Newsroom Robot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'live.html'
      - 'world.html'
      - 'asia.html'
      - 'hong-kong.html'
      - 'japan.html'
      - 'finance.html'
      - 'technology.html'
      - 'manga-anime.html'
      - 'manchester-united.html'
      - 'football.html'
      - 'stocks.html'
      - 'archive.html'
      - 'assets/js/home-current-ja.js'
      - 'assets/js/system-ja.js'
      - '.github/workflows/editor-in-chief-newsroom-robot.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: editor-in-chief-newsroom-robot
  # Never kill an active patrol. A newer trigger may wait, but the running
  # Editor-in-Chief must finish publishing one authoritative decision.
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Patrol, publish health truth, and authorize bounded recovery
        id: patrol
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceRepo = 'daily-brief-newspaper';
            const HOUR = 60 * 60 * 1000;
            const MINUTE = 60 * 1000;
            const HEALTH_PATH = 'data/newsroom-health.json';
            const HEALTH_HEARTBEAT_MS = 30 * MINUTE;
            const STUCK_RUN_MS = 35 * MINUTE;
            const RECOVERY_COOLDOWN_MS = 25 * MINUTE;
            const MAX_RECOVERY_ATTEMPTS = 2;

            async function entry(repoName, path) {
              try {
                const r = await github.rest.repos.getContent({ owner, repo: repoName, path, ref: 'main' });
                if (Array.isArray(r.data) || !r.data.content) return null;
                return {
                  sha: r.data.sha,
                  text: Buffer.from(r.data.content, r.data.encoding || 'base64').toString('utf8'),
                };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function raw(repoName, path) {
              return (await entry(repoName, path))?.text || null;
            }

            async function json(repoName, path) {
              const text = await raw(repoName, path);
              if (!text) return null;
              try { return JSON.parse(text); }
              catch (error) {
                core.warning(`${repoName}/${path}: invalid JSON: ${error.message}`);
                return null;
              }
            }

            function ms(payload) {
              for (const value of [payload?.generatedAt, payload?.lastUpdated, payload?.sourceGeneratedAt, payload?.checkedAt]) {
                const stamp = Date.parse(String(value || ''));
                if (Number.isFinite(stamp)) return stamp;
              }
              return NaN;
            }

            function day(value) {
              const text = String(value || '').slice(0, 10);
              return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
            }

            function currentTimestamp(sourceMs, localMs, toleranceMs) {
              return Number.isFinite(sourceMs) && Number.isFinite(localMs) && localMs >= sourceMs - toleranceMs;
            }

            function lagMinutes(sourceMs, localMs) {
              if (!Number.isFinite(sourceMs) || !Number.isFinite(localMs)) return null;
              return Math.max(0, Math.round((sourceMs - localMs) / MINUTE));
            }

            function iso(msValue) {
              return Number.isFinite(msValue) ? new Date(msValue).toISOString() : null;
            }

            async function active(workflow) {
              const r = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflow, per_page: 20 });
              return r.data.workflow_runs.find((run) => run.status !== 'completed') || null;
            }

            async function dispatchRecovery(workflow, reason) {
              const running = await active(workflow);
              if (running) {
                const age = Date.now() - Date.parse(running.created_at || 0);
                if (Number.isFinite(age) && age < STUCK_RUN_MS) {
                  core.warning(`${workflow} already active as run ${running.id}; reason=${reason}`);
                  return { workflow, dispatched: false, active: true, runId: running.id };
                }
                core.warning(`${workflow} run ${running.id} is older than ${Math.round(STUCK_RUN_MS / MINUTE)}m; cancelling stuck recovery`);
                try { await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: running.id }); }
                catch (error) { core.warning(`cancel ${workflow} ${running.id} failed: ${error.message}`); }
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: 'main' });
              core.warning(`ROBOT_DISPATCH ${workflow}; reason=${reason}`);
              return { workflow, dispatched: true, active: false, runId: null };
            }

            async function publishHealth(health) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const current = await entry(repo, HEALTH_PATH);
                let oldHealth = null;
                try { oldHealth = current?.text ? JSON.parse(current.text) : null; } catch (_) {}
                const semantic = (value) => JSON.stringify({
                  state: value?.state,
                  summary: value?.summary,
                  layers: value?.layers,
                  recovery: value?.recovery,
                  maintenance: value?.maintenance,
                  policy: value?.policy,
                  robot: value?.robot,
                });
                const oldAssessed = Date.parse(String(oldHealth?.assessedAt || ''));
                const heartbeatDue = !Number.isFinite(oldAssessed) || Date.now() - oldAssessed >= HEALTH_HEARTBEAT_MS;
                const changed = semantic(oldHealth) !== semantic(health);
                if (!changed && !heartbeatDue && current) {
                  core.info('ROBOT_HEALTH_UNCHANGED heartbeat not due');
                  return null;
                }
                try {
                  const result = await github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: HEALTH_PATH,
                    branch: 'main',
                    message: `newsroom health: ${String(health.state || 'red').toLowerCase()}`,
                    content: Buffer.from(JSON.stringify(health, null, 2) + '\n').toString('base64'),
                    ...(current?.sha ? { sha: current.sha } : {}),
                  });
                  core.warning(`ROBOT_HEALTH_PUBLISHED state=${health.state} maintenance=${health.maintenance?.status || 'unknown'} commit=${result.data.commit.sha}`);
                  return result.data.commit.sha;
                } catch (error) {
                  if ((error.status === 409 || error.status === 422) && attempt < 3) {
                    core.warning(`health write race attempt ${attempt}; retrying`);
                    await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                    continue;
                  }
                  throw error;
                }
              }
              return null;
            }

            const pages = [
              ['index.html', 'home-current-ja.js', null],
              ['live.html', 'live-guard.js', null],
              ['archive.html', 'data/archive.json', null],
              ['world.html', 'topic-ja-rolling.js', 'world'],
              ['asia.html', 'topic-ja-rolling.js', 'asia'],
              ['hong-kong.html', 'topic-ja-rolling.js', 'hong-kong'],
              ['japan.html', 'topic-ja-rolling.js', 'japan'],
              ['finance.html', 'topic-ja-rolling.js', 'market-economy'],
              ['technology.html', 'topic-ja-rolling.js', 'technology'],
              ['manga-anime.html', 'topic-ja-rolling.js', 'manga-anime'],
              ['manchester-united.html', 'topic-ja-rolling.js', 'manchester-united'],
              ['football.html', 'topic-ja-rolling.js', 'football'],
              ['stocks.html', 'stocks-ja.js', null],
            ];

            const structural = [];
            for (const [path, marker, desk] of pages) {
              const text = await raw(repo, path);
              if (!text) {
                structural.push(`${path}:missing`);
                continue;
              }
              if (marker && !text.includes(marker)) structural.push(`${path}:missing-${marker}`);
              if (desk && !text.includes(`data-desk="${desk}"`)) structural.push(`${path}:wrong-desk`);
            }

            const [sourceDaily, localDaily, sourceLive, localLive, sourceDesk, localDesk, sourceStocks, localStocks, previousHealth] = await Promise.all([
              json(sourceRepo, 'data/latest.json'), json(repo, 'data/latest.json'),
              json(sourceRepo, 'data/live.json'), json(repo, 'data/live.json'),
              json(sourceRepo, 'data/desk-latest.json'), json(repo, 'data/desk-latest.json'),
              json(sourceRepo, 'data/stocks-latest.json'), json(repo, 'data/stocks-latest.json'),
              json(repo, HEALTH_PATH),
            ]);

            const sourceDailyDay = day(sourceDaily?.date);
            const localDailyDay = day(localDaily?.date);
            const dailyCurrent = Boolean(sourceDailyDay && localDailyDay && localDailyDay >= sourceDailyDay);
            const sourceLiveMs = ms(sourceLive), localLiveMs = ms(localLive);
            const sourceDeskMs = ms(sourceDesk), localDeskMs = ms(localDesk);
            const sourceStockMs = ms(sourceStocks), localStockMs = ms(localStocks);
            const liveCurrent = currentTimestamp(sourceLiveMs, localLiveMs, MINUTE);
            const deskCurrent = currentTimestamp(sourceDeskMs, localDeskMs, HOUR);
            const stocksCurrent = currentTimestamp(sourceStockMs, localStockMs, HOUR);
            const structuralCurrent = structural.length === 0;

            const layers = {
              daily: { current: dailyCurrent, upstream: sourceDailyDay || null, japanese: localDailyDay || null },
              live: {
                current: liveCurrent,
                upstream: sourceLive?.lastUpdated || sourceLive?.generatedAt || null,
                japanese: localLive?.lastUpdated || localLive?.generatedAt || null,
                lagMinutes: lagMinutes(sourceLiveMs, localLiveMs),
              },
              desk: {
                current: deskCurrent,
                upstream: sourceDesk?.generatedAt || sourceDesk?.lastUpdated || null,
                japanese: localDesk?.generatedAt || localDesk?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceDeskMs, localDeskMs),
              },
              stocks: {
                current: stocksCurrent,
                upstream: sourceStocks?.generatedAt || sourceStocks?.lastUpdated || null,
                japanese: localStocks?.generatedAt || localStocks?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceStockMs, localStockMs),
              },
              structural: { current: structuralCurrent, defects: structural, pagesChecked: pages.length },
            };

            const recovery = {
              coreRequired: !dailyCurrent || !liveCurrent,
              rollingRequired: !deskCurrent || !stocksCurrent,
              structuralRequired: !structuralCurrent,
            };
            const failures = Object.entries(layers).filter(([, value]) => value.current !== true).map(([name]) => name);
            const state = failures.length ? 'RED' : 'GREEN';

            const incidentParts = [];
            if (recovery.coreRequired) {
              const failed = [];
              if (!dailyCurrent) failed.push('daily');
              if (!liveCurrent) failed.push('live');
              incidentParts.push(`core:${failed.join('+')}`);
            }
            if (recovery.rollingRequired) {
              const failed = [];
              if (!deskCurrent) failed.push('desk');
              if (!stocksCurrent) failed.push('stocks');
              incidentParts.push(`rolling:${failed.join('+')}`);
            }
            if (recovery.structuralRequired) {
              incidentParts.push(`structural:${[...structural].sort().join(',')}`);
            }
            const incidentKey = incidentParts.join('|') || 'healthy';
            const previousMaintenance = previousHealth?.maintenance || {};
            const sameIncident = state === 'RED' && previousMaintenance.incidentKey === incidentKey && previousMaintenance.status !== 'resolved';
            let attempts = sameIncident ? Math.max(0, Number(previousMaintenance.attempts) || 0) : 0;
            let lastAttemptAt = sameIncident ? previousMaintenance.lastAttemptAt || null : null;
            let lastAttemptMs = Date.parse(String(lastAttemptAt || ''));
            let maintenanceStatus = state === 'GREEN' ? 'resolved' : 'observed';
            let decision = state === 'GREEN' ? 'NO_REPAIR_REQUIRED' : 'ASSESS_RECOVERY';
            let recoveryResults = [];
            let nextEligibleAt = null;

            if (state === 'RED') {
              const cooldownActive = Number.isFinite(lastAttemptMs) && Date.now() - lastAttemptMs < RECOVERY_COOLDOWN_MS;
              if (attempts >= MAX_RECOVERY_ATTEMPTS) {
                maintenanceStatus = 'escalated';
                decision = 'AUTO_REPAIR_BUDGET_EXHAUSTED';
                core.warning(`EDITOR_ESCALATION incident=${incidentKey} attempts=${attempts}/${MAX_RECOVERY_ATTEMPTS}`);
              } else if (cooldownActive) {
                maintenanceStatus = 'cooldown';
                decision = 'WAIT_FOR_COOLDOWN';
                nextEligibleAt = iso(lastAttemptMs + RECOVERY_COOLDOWN_MS);
                core.warning(`EDITOR_COOLDOWN incident=${incidentKey} attempts=${attempts}/${MAX_RECOVERY_ATTEMPTS} next=${nextEligibleAt}`);
              } else {
                if (recovery.coreRequired) recoveryResults.push(await dispatchRecovery('sync-japanese-news.yml', `incident=${incidentKey}; daily=${!dailyCurrent} live=${!liveCurrent}; current-only=true`));
                if (recovery.rollingRequired) recoveryResults.push(await dispatchRecovery('repair-extra-translation-quality.yml', `incident=${incidentKey}; desk=${!deskCurrent} stocks=${!stocksCurrent}`));
                if (recovery.structuralRequired) recoveryResults.push(await dispatchRecovery('auto-maintenance.yml', `incident=${incidentKey}; structural=${structural.join(',')}`));

                const dispatched = recoveryResults.some((result) => result.dispatched);
                const alreadyActive = recoveryResults.some((result) => result.active);
                if (dispatched) {
                  attempts += 1;
                  lastAttemptAt = new Date().toISOString();
                  lastAttemptMs = Date.parse(lastAttemptAt);
                  nextEligibleAt = iso(lastAttemptMs + RECOVERY_COOLDOWN_MS);
                  maintenanceStatus = 'repairing';
                  decision = 'AUTHORIZED_BOUNDED_REPAIR';
                } else if (alreadyActive) {
                  if (!sameIncident || !Number.isFinite(lastAttemptMs)) {
                    attempts = Math.max(1, attempts);
                    lastAttemptAt = new Date().toISOString();
                    lastAttemptMs = Date.parse(lastAttemptAt);
                  }
                  nextEligibleAt = iso(lastAttemptMs + RECOVERY_COOLDOWN_MS);
                  maintenanceStatus = 'repairing';
                  decision = 'RECOVERY_ALREADY_ACTIVE';
                } else {
                  maintenanceStatus = 'cooldown';
                  decision = 'NO_DISPATCH_AVAILABLE';
                }
              }
            }

            const maintenance = {
              owner: 'Editor-in-Chief',
              executor: 'Maintenance Robot',
              incidentKey,
              status: maintenanceStatus,
              decision,
              attempts,
              maxAttempts: MAX_RECOVERY_ATTEMPTS,
              lastAttemptAt,
              nextEligibleAt,
              cooldownMinutes: Math.round(RECOVERY_COOLDOWN_MS / MINUTE),
              currentOnlyCoreRepair: true,
              archiveBackfillAllowed: false,
              results: recoveryResults.map((result) => ({
                workflow: result.workflow,
                dispatched: result.dispatched,
                active: result.active,
                runId: result.runId,
              })),
            };

            const health = {
              version: 3,
              assessedAt: new Date().toISOString(),
              state,
              summary: state === 'GREEN'
                ? 'ALL_REQUIRED_NEWS_LAYERS_CURRENT'
                : maintenanceStatus === 'escalated'
                  ? `ESCALATED:${failures.join(',')}`
                  : `RECOVERY_REQUIRED:${failures.join(',')}`,
              layers,
              recovery,
              maintenance,
              robot: {
                current: true,
                runId: context.runId,
                event: context.eventName,
                role: 'editor-in-chief-orchestrator',
                executor: 'bounded-maintenance-workers',
                selfHealingLoop: false,
              },
              policy: {
                repairRunningRemainsRed: true,
                missingHealthFailsClosed: true,
                liveToleranceMinutes: 1,
                rollingToleranceMinutes: 60,
                healthHeartbeatMinutes: 30,
                recoveryCooldownMinutes: Math.round(RECOVERY_COOLDOWN_MS / MINUTE),
                maxRecoveryAttemptsPerIncident: MAX_RECOVERY_ATTEMPTS,
                currentOnlyCoreRepair: true,
                archiveBackfillAllowed: false,
                successfulRecoveryRecheckOnly: true,
              },
            };

            core.info(`EDITOR state=${state} summary=${health.summary}`);
            core.info(`EDITOR Daily source=${sourceDailyDay || 'missing'} japanese=${localDailyDay || 'missing'} current=${dailyCurrent}`);
            core.info(`EDITOR Live source=${layers.live.upstream || 'missing'} japanese=${layers.live.japanese || 'missing'} current=${liveCurrent} lag=${layers.live.lagMinutes}`);
            core.info(`EDITOR Desk source=${layers.desk.upstream || 'missing'} japanese=${layers.desk.japanese || 'missing'} current=${deskCurrent} lag=${layers.desk.lagMinutes}`);
            core.info(`EDITOR Stocks source=${layers.stocks.upstream || 'missing'} japanese=${layers.stocks.japanese || 'missing'} current=${stocksCurrent} lag=${layers.stocks.lagMinutes}`);
            core.info(`EDITOR Structural current=${structuralCurrent} defects=${structural.join(',') || 'none'}`);
            core.info(`EDITOR Maintenance incident=${incidentKey} status=${maintenanceStatus} decision=${decision} attempts=${attempts}/${MAX_RECOVERY_ATTEMPTS}`);

            const healthCommitSha = await publishHealth(health);
            core.setOutput('assessment_complete', 'true');

            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = branch.data.commit.sha;
            const pageRuns = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'pages.yml', per_page: 20 });
            const latestSuccessfulPage = pageRuns.data.workflow_runs.find((run) => run.conclusion === 'success');
            const activeForMain = pageRuns.data.workflow_runs.find((run) => run.status !== 'completed' && run.head_sha === mainSha);
            if (!activeForMain && (!latestSuccessfulPage || latestSuccessfulPage.head_sha !== mainSha)) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: 'main' });
              core.warning(`EDITOR_DISPATCH pages.yml; main=${mainSha}; healthCommit=${healthCommitSha || 'none'}`);
            }

            await core.summary
              .addHeading('Editor-in-Chief automatic maintenance')
              .addTable([
                [{data: 'State', header: true}, state],
                [{data: 'Incident', header: true}, incidentKey],
                [{data: 'Decision', header: true}, decision],
                [{data: 'Robot status', header: true}, maintenanceStatus],
                [{data: 'Attempts', header: true}, `${attempts}/${MAX_RECOVERY_ATTEMPTS}`],
                [{data: 'Next eligible', header: true}, nextEligibleAt || 'n/a'],
                [{data: 'Archive backfill', header: true}, 'disabled'],
              ])
              .write();

            if (state === 'RED') {
              if (maintenanceStatus === 'escalated') core.setFailed(`EDITOR_IN_CHIEF_ESCALATED ${health.summary}; incident=${incidentKey}`);
              else core.setFailed(`EDITOR_IN_CHIEF_RED ${health.summary}; maintenance=${maintenanceStatus}`);
            } else {
              core.info('EDITOR_IN_CHIEF_GREEN all required reader layers current');
            }

      - name: Guarantee a fresh RED heartbeat if patrol crashes
        if: ${{ always() && steps.patrol.outputs.assessment_complete != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = 'data/newsroom-health.json';
            const FIVE_MINUTES = 5 * 60 * 1000;

            async function currentEntry() {
              try {
                const r = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                if (Array.isArray(r.data) || !r.data.content) return null;
                return {
                  sha: r.data.sha,
                  text: Buffer.from(r.data.content, r.data.encoding || 'base64').toString('utf8'),
                };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const entry = await currentEntry();
              let previous = null;
              try { previous = entry?.text ? JSON.parse(entry.text) : null; } catch (_) {}
              const previousMs = Date.parse(String(previous?.assessedAt || ''));
              if (Number.isFinite(previousMs) && Date.now() - previousMs < FIVE_MINUTES) {
                core.info('Recent health snapshot already exists; preserving detailed patrol result.');
                return;
              }

              const fallback = {
                version: 3,
                assessedAt: new Date().toISOString(),
                state: 'RED',
                summary: 'EDITOR_IN_CHIEF_EXECUTION_FAILED_BEFORE_FRESH_HEALTH_PUBLISH',
                layers: previous?.layers || {},
                recovery: {
                  ...(previous?.recovery || {}),
                  robotRequired: true,
                },
                maintenance: {
                  ...(previous?.maintenance || {}),
                  owner: 'Editor-in-Chief',
                  executor: 'Maintenance Robot',
                  status: 'orchestrator-failed',
                  decision: 'WAIT_FOR_NEXT_PATROL',
                  currentOnlyCoreRepair: true,
                  archiveBackfillAllowed: false,
                },
                robot: {
                  current: false,
                  runId: context.runId,
                  event: context.eventName,
                  role: 'editor-in-chief-orchestrator',
                  executor: 'bounded-maintenance-workers',
                  selfHealingLoop: false,
                  reason: 'patrol step failed before a fresh health snapshot could be published',
                },
                policy: {
                  ...(previous?.policy || {}),
                  repairRunningRemainsRed: true,
                  missingHealthFailsClosed: true,
                  healthHeartbeatMinutes: 30,
                  recoveryCooldownMinutes: 25,
                  maxRecoveryAttemptsPerIncident: 2,
                  currentOnlyCoreRepair: true,
                  archiveBackfillAllowed: false,
                  successfulRecoveryRecheckOnly: true,
                },
              };

              try {
                const result = await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  branch: 'main',
                  message: 'newsroom health: editor-in-chief execution failure',
                  content: Buffer.from(JSON.stringify(fallback, null, 2) + '\n').toString('base64'),
                  ...(entry?.sha ? { sha: entry.sha } : {}),
                });
                core.warning(`EDITOR_FAILURE_HEARTBEAT_PUBLISHED commit=${result.data.commit.sha}`);
                return;
              } catch (error) {
                if ((error.status === 409 || error.status === 422) && attempt < 3) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1000));
                  continue;
                }
                throw error;
              }
            }
