name: Editor-in-Chief Newsroom Robot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'data/latest.json'
      - 'data/live.json'
      - 'data/desk-latest.json'
      - 'data/stocks-latest.json'
      - 'index.html'
      - 'live.html'
      - 'world.html'
      - 'asia.html'
      - 'hong-kong.html'
      - 'japan.html'
      - 'finance.html'
      - 'technology.html'
      - 'manga-anime.html'
      - 'manchester-united.html'
      - 'football.html'
      - 'stocks.html'
      - 'archive.html'
      - 'assets/js/home-current-ja.js'
      - 'assets/js/topic-ja-rolling.js'
      - 'assets/js/stocks-ja.js'
      - 'assets/js/system-ja.js'
      - '.github/workflows/editor-in-chief-newsroom-robot.yml'
      - '.github/workflows/editor-in-chief-recheck-bridge.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: editor-in-chief-newsroom-robot
  cancel-in-progress: false

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect newsroom truth and keep recovery alive
        id: patrol
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceRepo = 'daily-brief-newspaper';
            const MINUTE = 60 * 1000;
            const HOUR = 60 * MINUTE;
            const HEALTH_PATH = 'data/newsroom-health.json';
            const COOLDOWN_MS = 25 * MINUTE;
            const HEARTBEAT_MS = 30 * MINUTE;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function localEntry(path) {
              let lastError = null;
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                  if (Array.isArray(response.data) || !response.data.content) return null;
                  return {
                    sha: response.data.sha,
                    text: Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8'),
                  };
                } catch (error) {
                  lastError = error;
                  if ([404, 409, 429, 500, 502, 503, 504].includes(error.status) && attempt < 3) {
                    await sleep(attempt * 800);
                    continue;
                  }
                  if (error.status === 404) return null;
                  throw error;
                }
              }
              throw lastError;
            }

            async function sourceText(path) {
              let last = 'unknown';
              for (let attempt = 1; attempt <= 4; attempt += 1) {
                const url = `https://raw.githubusercontent.com/${owner}/${sourceRepo}/main/${path}?editor=${context.runId}-${Date.now()}-${attempt}`;
                try {
                  const response = await fetch(url, {
                    headers: {
                      'User-Agent': 'daily-brief-japanese-editor-in-chief',
                      'Cache-Control': 'no-cache, no-store, max-age=0',
                      'Pragma': 'no-cache',
                    },
                  });
                  if (response.ok) return await response.text();
                  last = `HTTP ${response.status}`;
                } catch (error) {
                  last = error.message;
                }
                if (attempt < 4) await sleep(attempt * 1000);
              }
              core.warning(`UPSTREAM_READ_UNAVAILABLE ${path}: ${last}`);
              return null;
            }

            async function localJson(path) {
              const entry = await localEntry(path);
              if (!entry?.text) return null;
              try { return JSON.parse(entry.text); }
              catch (error) {
                core.warning(`LOCAL_JSON_INVALID ${path}: ${error.message}`);
                return null;
              }
            }

            async function sourceJson(path) {
              const text = await sourceText(path);
              if (!text) return null;
              try { return JSON.parse(text); }
              catch (error) {
                core.warning(`SOURCE_JSON_INVALID ${path}: ${error.message}`);
                return null;
              }
            }

            function stamp(payload) {
              for (const value of [payload?.generatedAt, payload?.lastUpdated, payload?.sourceGeneratedAt, payload?.checkedAt]) {
                const valueMs = Date.parse(String(value || ''));
                if (Number.isFinite(valueMs)) return valueMs;
              }
              return NaN;
            }

            function dateDay(payload) {
              const value = String(payload?.date || '').slice(0, 10);
              return /^\d{4}-\d{2}-\d{2}$/.test(value) ? value : '';
            }

            function currentTimestamp(sourceMs, localMs, toleranceMs) {
              return Number.isFinite(sourceMs) && Number.isFinite(localMs) && localMs >= sourceMs - toleranceMs;
            }

            function lagMinutes(sourceMs, localMs) {
              if (!Number.isFinite(sourceMs) || !Number.isFinite(localMs)) return null;
              return Math.max(0, Math.round((sourceMs - localMs) / MINUTE));
            }

            function sourceVersion(label, payload) {
              if (label === 'daily') return dateDay(payload) || 'missing';
              const valueMs = stamp(payload);
              return Number.isFinite(valueMs) ? new Date(valueMs).toISOString() : 'missing';
            }

            async function active(workflow) {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflow,
                branch: 'main',
                per_page: 20,
              });
              return response.data.workflow_runs.find((run) => run.status !== 'completed') || null;
            }

            async function dispatch(workflow, reason) {
              const running = await active(workflow);
              if (running) {
                core.warning(`RECOVERY_ALREADY_ACTIVE workflow=${workflow} run=${running.id} reason=${reason}`);
                return { workflow, dispatched: false, active: true, runId: running.id };
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: 'main' });
              core.warning(`MAINTENANCE_ROBOT_DISPATCH workflow=${workflow} reason=${reason}`);
              return { workflow, dispatched: true, active: false, runId: null };
            }

            const pageChecks = [
              ['index.html', 'home-current-ja.js', null],
              ['live.html', 'live-guard.js', null],
              ['archive.html', 'data/archive.json', null],
              ['world.html', 'topic-ja-rolling.js', 'world'],
              ['asia.html', 'topic-ja-rolling.js', 'asia'],
              ['hong-kong.html', 'topic-ja-rolling.js', 'hong-kong'],
              ['japan.html', 'topic-ja-rolling.js', 'japan'],
              ['finance.html', 'topic-ja-rolling.js', 'market-economy'],
              ['technology.html', 'topic-ja-rolling.js', 'technology'],
              ['manga-anime.html', 'topic-ja-rolling.js', 'manga-anime'],
              ['manchester-united.html', 'topic-ja-rolling.js', 'manchester-united'],
              ['football.html', 'topic-ja-rolling.js', 'football'],
              ['stocks.html', 'stocks-ja.js', null],
            ];

            const structuralDefects = [];
            for (const [path, marker, desk] of pageChecks) {
              const entry = await localEntry(path);
              const text = entry?.text || '';
              if (!text) {
                structuralDefects.push(`${path}:missing`);
                continue;
              }
              if (marker && !text.includes(marker)) structuralDefects.push(`${path}:missing-${marker}`);
              if (desk && !text.includes(`data-desk="${desk}"`)) structuralDefects.push(`${path}:wrong-desk`);
            }

            const [
              sourceDaily, localDaily,
              sourceLive, localLive,
              sourceDesk, localDesk,
              sourceStocks, localStocks,
              previousHealth,
            ] = await Promise.all([
              sourceJson('data/latest.json'), localJson('data/latest.json'),
              sourceJson('data/live.json'), localJson('data/live.json'),
              sourceJson('data/desk-latest.json'), localJson('data/desk-latest.json'),
              sourceJson('data/stocks-latest.json'), localJson('data/stocks-latest.json'),
              localJson(HEALTH_PATH),
            ]);

            const sourceReadFailures = [];
            if (!sourceDaily) sourceReadFailures.push('daily');
            if (!sourceLive) sourceReadFailures.push('live');
            if (!sourceDesk) sourceReadFailures.push('desk');
            if (!sourceStocks) sourceReadFailures.push('stocks');
            const sourceReadable = sourceReadFailures.length === 0;

            const sourceDailyDay = dateDay(sourceDaily);
            const localDailyDay = dateDay(localDaily);
            const dailyCurrent = Boolean(sourceDailyDay && localDailyDay && localDailyDay >= sourceDailyDay);
            const sourceLiveMs = stamp(sourceLive);
            const localLiveMs = stamp(localLive);
            const sourceDeskMs = stamp(sourceDesk);
            const localDeskMs = stamp(localDesk);
            const sourceStocksMs = stamp(sourceStocks);
            const localStocksMs = stamp(localStocks);
            const liveCurrent = currentTimestamp(sourceLiveMs, localLiveMs, MINUTE);
            const deskCurrent = currentTimestamp(sourceDeskMs, localDeskMs, HOUR);
            const stocksCurrent = currentTimestamp(sourceStocksMs, localStocksMs, HOUR);
            const structuralCurrent = structuralDefects.length === 0;

            const layers = {
              daily: { current: dailyCurrent, upstream: sourceDailyDay || null, japanese: localDailyDay || null },
              live: {
                current: liveCurrent,
                upstream: sourceLive?.lastUpdated || sourceLive?.generatedAt || null,
                japanese: localLive?.lastUpdated || localLive?.generatedAt || null,
                lagMinutes: lagMinutes(sourceLiveMs, localLiveMs),
              },
              desk: {
                current: deskCurrent,
                upstream: sourceDesk?.generatedAt || sourceDesk?.lastUpdated || null,
                japanese: localDesk?.generatedAt || localDesk?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceDeskMs, localDeskMs),
              },
              stocks: {
                current: stocksCurrent,
                upstream: sourceStocks?.generatedAt || sourceStocks?.lastUpdated || null,
                japanese: localStocks?.generatedAt || localStocks?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceStocksMs, localStocksMs),
              },
              structural: {
                current: structuralCurrent,
                defects: structuralDefects,
                pagesChecked: pageChecks.length,
              },
            };

            const recovery = {
              coreRequired: sourceReadable && (!dailyCurrent || !liveCurrent),
              rollingRequired: sourceReadable && (!deskCurrent || !stocksCurrent),
              structuralRequired: !structuralCurrent,
            };

            const stale = [];
            if (sourceReadable && !dailyCurrent) stale.push('daily');
            if (sourceReadable && !liveCurrent) stale.push('live');
            if (sourceReadable && !deskCurrent) stale.push('desk');
            if (sourceReadable && !stocksCurrent) stale.push('stocks');
            if (!structuralCurrent) stale.push('structural');

            const incidentParts = [];
            if (!sourceReadable) incidentParts.push(`source-read:${sourceReadFailures.join('+')}`);
            if (sourceReadable && !dailyCurrent) incidentParts.push(`daily@${sourceVersion('daily', sourceDaily)}`);
            if (sourceReadable && !liveCurrent) incidentParts.push(`live@${sourceVersion('live', sourceLive)}`);
            if (sourceReadable && !deskCurrent) incidentParts.push(`desk@${sourceVersion('desk', sourceDesk)}`);
            if (sourceReadable && !stocksCurrent) incidentParts.push(`stocks@${sourceVersion('stocks', sourceStocks)}`);
            if (!structuralCurrent) incidentParts.push(`structural@${[...structuralDefects].sort().join(',')}`);
            const incidentKey = incidentParts.join('|') || 'healthy';

            const state = sourceReadable && stale.length === 0 ? 'GREEN' : 'RED';
            const previousMaintenance = previousHealth?.maintenance || {};
            const sameIncident = state === 'RED'
              && previousMaintenance.incidentKey === incidentKey
              && previousMaintenance.status !== 'resolved';
            let attempts = sameIncident ? Math.max(0, Number(previousMaintenance.attempts) || 0) : 0;
            let lastAttemptAt = sameIncident ? previousMaintenance.lastAttemptAt || null : null;
            let lastAttemptMs = Date.parse(String(lastAttemptAt || ''));
            let nextEligibleAt = null;
            let status = state === 'GREEN' ? 'resolved' : 'observed';
            let decision = state === 'GREEN' ? 'NO_REPAIR_REQUIRED' : 'ASSESS_RECOVERY';
            const results = [];

            if (state === 'RED' && !sourceReadable) {
              status = 'source-read-degraded';
              decision = 'NO_MUTATION_RECHECK_NEXT_PATROL';
              attempts = 0;
              lastAttemptAt = null;
            } else if (state === 'RED') {
              const cooldown = Number.isFinite(lastAttemptMs) && Date.now() - lastAttemptMs < COOLDOWN_MS;
              if (cooldown) {
                status = attempts >= 2 ? 'escalated-cooldown' : 'cooldown';
                decision = attempts >= 2 ? 'ESCALATED_RETRY_WAIT' : 'WAIT_FOR_COOLDOWN';
                nextEligibleAt = new Date(lastAttemptMs + COOLDOWN_MS).toISOString();
              } else {
                if (recovery.coreRequired) {
                  results.push(await dispatch(
                    'sync-japanese-news.yml',
                    `incident=${incidentKey}; current-only=true; archive-backfill=false`
                  ));
                }
                if (recovery.rollingRequired) {
                  results.push(await dispatch(
                    'repair-extra-translation-quality.yml',
                    `incident=${incidentKey}`
                  ));
                }
                if (recovery.structuralRequired) {
                  results.push(await dispatch(
                    'auto-maintenance.yml',
                    `incident=${incidentKey}; structural-only=true`
                  ));
                }

                const dispatched = results.some((result) => result.dispatched);
                const alreadyActive = results.some((result) => result.active);
                if (dispatched) {
                  attempts += 1;
                  lastAttemptAt = new Date().toISOString();
                  lastAttemptMs = Date.parse(lastAttemptAt);
                  nextEligibleAt = new Date(lastAttemptMs + COOLDOWN_MS).toISOString();
                  status = attempts >= 2 ? 'escalated-retrying' : 'repairing';
                  decision = attempts >= 2 ? 'ESCALATED_RETRY_AUTHORIZED' : 'AUTHORIZED_BOUNDED_REPAIR';
                } else if (alreadyActive) {
                  status = attempts >= 2 ? 'escalated-retrying' : 'repairing';
                  decision = 'RECOVERY_ALREADY_ACTIVE';
                } else {
                  status = 'observed';
                  decision = 'NO_DISPATCH_AVAILABLE';
                }
              }
            }

            const maintenance = {
              owner: 'Editor-in-Chief',
              executor: 'Maintenance Robot',
              incidentKey,
              sourceVersionBound: true,
              status,
              decision,
              attempts,
              lastAttemptAt,
              nextEligibleAt,
              cooldownMinutes: Math.round(COOLDOWN_MS / MINUTE),
              terminalRepairBudget: false,
              currentOnlyCoreRepair: true,
              archiveBackfillAllowed: false,
              results,
            };

            const health = {
              version: 5,
              assessedAt: new Date().toISOString(),
              state,
              summary: state === 'GREEN'
                ? 'ALL_REQUIRED_NEWS_LAYERS_CURRENT'
                : !sourceReadable
                  ? `SOURCE_READ_DEGRADED:${sourceReadFailures.join(',')}`
                  : `RECOVERY_REQUIRED:${stale.join(',')}`,
              layers,
              recovery,
              maintenance,
              sourceRead: {
                mode: 'public-raw-retry',
                readable: sourceReadable,
                failures: sourceReadFailures,
                attemptsPerFile: 4,
                false404ConsumesRepairBudget: false,
              },
              robot: {
                current: true,
                runId: context.runId,
                event: context.eventName,
                role: 'editor-in-chief-orchestrator',
                executor: 'continuous-maintenance-workers',
                selfHealingLoop: false,
              },
              policy: {
                repairRunningRemainsRed: true,
                missingHealthFailsClosed: true,
                liveToleranceMinutes: 1,
                rollingToleranceMinutes: 60,
                healthHeartbeatMinutes: 30,
                recoveryCooldownMinutes: Math.round(COOLDOWN_MS / MINUTE),
                sourceVersionBoundIncidents: true,
                terminalRepairBudget: false,
                escalationDoesNotDisableRecovery: true,
                currentOnlyCoreRepair: true,
                archiveBackfillAllowed: false,
                recoveryCompletionAlwaysRechecked: true,
                upstreamReadFailureDoesNotAuthorizeMutation: true,
              },
            };

            async function publishHealth(value) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                const current = await localEntry(HEALTH_PATH);
                let old = null;
                try { old = current?.text ? JSON.parse(current.text) : null; } catch (_) {}
                const semantic = (item) => JSON.stringify({
                  state: item?.state,
                  summary: item?.summary,
                  layers: item?.layers,
                  recovery: item?.recovery,
                  maintenance: item?.maintenance,
                  sourceRead: item?.sourceRead,
                  policy: item?.policy,
                });
                const oldAssessed = Date.parse(String(old?.assessedAt || ''));
                const heartbeatDue = !Number.isFinite(oldAssessed) || Date.now() - oldAssessed >= HEARTBEAT_MS;
                if (current && semantic(old) === semantic(value) && !heartbeatDue) {
                  core.info('NEWSROOM_HEALTH_UNCHANGED');
                  return null;
                }
                try {
                  const response = await github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: HEALTH_PATH,
                    branch: 'main',
                    message: `newsroom health: ${String(value.state).toLowerCase()}`,
                    content: Buffer.from(JSON.stringify(value, null, 2) + '\n').toString('base64'),
                    ...(current?.sha ? { sha: current.sha } : {}),
                  });
                  core.warning(`NEWSROOM_HEALTH_PUBLISHED state=${value.state} commit=${response.data.commit.sha}`);
                  return response.data.commit.sha;
                } catch (error) {
                  if ([409, 422].includes(error.status) && attempt < 3) {
                    await sleep(attempt * 1000);
                    continue;
                  }
                  throw error;
                }
              }
              return null;
            }

            core.info(`EDITOR state=${state} incident=${incidentKey} status=${status} decision=${decision}`);
            core.info(`EDITOR Live upstream=${layers.live.upstream || 'missing'} japanese=${layers.live.japanese || 'missing'} lag=${layers.live.lagMinutes}`);
            core.info(`EDITOR Desk upstream=${layers.desk.upstream || 'missing'} japanese=${layers.desk.japanese || 'missing'} lag=${layers.desk.lagMinutes}`);
            core.info(`EDITOR Stocks upstream=${layers.stocks.upstream || 'missing'} japanese=${layers.stocks.japanese || 'missing'} lag=${layers.stocks.lagMinutes}`);

            const healthCommit = await publishHealth(health);
            core.setOutput('assessment_complete', 'true');

            if (state === 'GREEN') {
              const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
              const mainSha = branch.data.commit.sha;
              const pageRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'pages.yml',
                branch: 'main',
                per_page: 20,
              });
              const activePages = pageRuns.data.workflow_runs.find((run) => run.status !== 'completed');
              const latestSuccess = pageRuns.data.workflow_runs.find((run) => run.conclusion === 'success');
              if (!activePages && (!latestSuccess || latestSuccess.head_sha !== mainSha)) {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: 'pages.yml',
                  ref: 'main',
                });
                core.warning(`EDITOR_PAGES_DISPATCH main=${mainSha} healthCommit=${healthCommit || 'none'}`);
              }
            }

            await core.summary
              .addHeading('Editor-in-Chief automatic maintenance')
              .addTable([
                [{data: 'State', header: true}, state],
                [{data: 'Incident', header: true}, incidentKey],
                [{data: 'Decision', header: true}, decision],
                [{data: 'Robot status', header: true}, status],
                [{data: 'Attempts for this source version', header: true}, String(attempts)],
                [{data: 'Next eligible', header: true}, nextEligibleAt || 'n/a'],
                [{data: 'Archive backfill', header: true}, 'disabled'],
              ])
              .write();

            if (state === 'RED') {
              if (!sourceReadable) {
                core.setFailed(`EDITOR_SOURCE_READ_DEGRADED ${sourceReadFailures.join(',')}`);
              } else {
                core.setFailed(`EDITOR_IN_CHIEF_RED ${health.summary}; maintenance=${status}; incident=${incidentKey}`);
              }
            } else {
              core.info('EDITOR_IN_CHIEF_GREEN all required newsroom layers current');
            }

      - name: Publish fail-closed health if patrol crashes before assessment
        if: always() && steps.patrol.outputs.assessment_complete != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const path = 'data/newsroom-health.json';
            let current = null;
            let prior = null;
            try {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(response.data) && response.data.content) {
                current = response.data;
                prior = JSON.parse(Buffer.from(response.data.content, response.data.encoding || 'base64').toString('utf8'));
              }
            } catch (_) {}

            const fallback = {
              version: 5,
              assessedAt: new Date().toISOString(),
              state: 'RED',
              summary: 'EDITOR_ORCHESTRATOR_FAILED_BEFORE_ASSESSMENT',
              layers: prior?.layers || {},
              recovery: prior?.recovery || {},
              maintenance: {
                ...(prior?.maintenance || {}),
                owner: 'Editor-in-Chief',
                executor: 'Maintenance Robot',
                status: 'orchestrator-failed',
                decision: 'RECHECK_NEXT_PATROL',
                terminalRepairBudget: false,
                currentOnlyCoreRepair: true,
                archiveBackfillAllowed: false,
              },
              sourceRead: prior?.sourceRead || { readable: false, failures: ['orchestrator'] },
              robot: {
                current: false,
                runId: context.runId,
                event: context.eventName,
                role: 'editor-in-chief-orchestrator',
                executor: 'continuous-maintenance-workers',
                selfHealingLoop: false,
              },
              policy: {
                ...(prior?.policy || {}),
                terminalRepairBudget: false,
                escalationDoesNotDisableRecovery: true,
                currentOnlyCoreRepair: true,
                archiveBackfillAllowed: false,
                recoveryCompletionAlwaysRechecked: true,
              },
            };

            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: 'newsroom health: red orchestrator failure',
              content: Buffer.from(JSON.stringify(fallback, null, 2) + '\n').toString('base64'),
              ...(current?.sha ? { sha: current.sha } : {}),
            });
            core.setFailed('EDITOR_ORCHESTRATOR_FAILED_BEFORE_ASSESSMENT');
