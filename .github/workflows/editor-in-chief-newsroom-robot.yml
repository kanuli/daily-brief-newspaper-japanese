name: Editor-in-Chief Newsroom Robot

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'live.html'
      - 'world.html'
      - 'asia.html'
      - 'hong-kong.html'
      - 'japan.html'
      - 'finance.html'
      - 'technology.html'
      - 'manga-anime.html'
      - 'manchester-united.html'
      - 'football.html'
      - 'stocks.html'
      - 'archive.html'
      - 'assets/js/home-current-ja.js'
      - 'assets/js/system-ja.js'
      - '.github/workflows/editor-in-chief-newsroom-robot.yml'
  schedule:
    - cron: '5,20,35,50 * * * *'

permissions:
  actions: write
  contents: write

concurrency:
  group: editor-in-chief-newsroom-robot
  cancel-in-progress: true

jobs:
  patrol:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Patrol, publish health truth, and recover stale pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const crypto = require('crypto');
            const sourceRepo = 'daily-brief-newspaper';
            const HOUR = 60 * 60 * 1000;
            const MINUTE = 60 * 1000;
            const HEALTH_PATH = 'data/newsroom-health.json';
            const HEALTH_HEARTBEAT_MS = 30 * MINUTE;
            const STUCK_RUN_MS = 30 * MINUTE;

            async function entry(repoName, path) {
              try {
                const r = await github.rest.repos.getContent({ owner, repo: repoName, path, ref: 'main' });
                if (Array.isArray(r.data) || !r.data.content) return null;
                return {
                  sha: r.data.sha,
                  text: Buffer.from(r.data.content, r.data.encoding || 'base64').toString('utf8'),
                };
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            async function raw(repoName, path) {
              return (await entry(repoName, path))?.text || null;
            }

            async function json(repoName, path) {
              const text = await raw(repoName, path);
              if (!text) return null;
              try { return JSON.parse(text); }
              catch (error) {
                core.warning(`${repoName}/${path}: invalid JSON: ${error.message}`);
                return null;
              }
            }

            function ms(payload) {
              const values = [payload?.generatedAt, payload?.lastUpdated, payload?.sourceGeneratedAt, payload?.checkedAt];
              for (const value of values) {
                const stamp = Date.parse(String(value || ''));
                if (Number.isFinite(stamp)) return stamp;
              }
              return NaN;
            }

            function day(value) {
              const text = String(value || '').slice(0, 10);
              return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : '';
            }

            function currentTimestamp(sourceMs, localMs, toleranceMs) {
              return Number.isFinite(sourceMs) && Number.isFinite(localMs) && localMs >= sourceMs - toleranceMs;
            }

            function lagMinutes(sourceMs, localMs) {
              if (!Number.isFinite(sourceMs) || !Number.isFinite(localMs)) return null;
              return Math.max(0, Math.round((sourceMs - localMs) / MINUTE));
            }

            async function active(workflow) {
              const r = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: workflow, per_page: 15 });
              return r.data.workflow_runs.find((run) => run.status !== 'completed') || null;
            }

            async function dispatchRecovery(workflow, reason) {
              const running = await active(workflow);
              if (running) {
                const age = Date.now() - Date.parse(running.created_at || 0);
                if (Number.isFinite(age) && age < STUCK_RUN_MS) {
                  core.warning(`${workflow} already active as run ${running.id}; reason=${reason}`);
                  return { dispatched: false, active: true, runId: running.id };
                }
                core.warning(`${workflow} run ${running.id} is stale; cancelling before recovery`);
                try { await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: running.id }); }
                catch (error) { core.warning(`cancel ${workflow} ${running.id} failed: ${error.message}`); }
              }
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: workflow, ref: 'main' });
              core.warning(`ROBOT_DISPATCH ${workflow}; reason=${reason}`);
              return { dispatched: true, active: false, runId: null };
            }

            const pages = [
              ['index.html', 'home-current-ja.js', null],
              ['live.html', 'live-guard.js', null],
              ['archive.html', 'data/archive.json', null],
              ['world.html', 'topic-ja-rolling.js', 'world'],
              ['asia.html', 'topic-ja-rolling.js', 'asia'],
              ['hong-kong.html', 'topic-ja-rolling.js', 'hong-kong'],
              ['japan.html', 'topic-ja-rolling.js', 'japan'],
              ['finance.html', 'topic-ja-rolling.js', 'market-economy'],
              ['technology.html', 'topic-ja-rolling.js', 'technology'],
              ['manga-anime.html', 'topic-ja-rolling.js', 'manga-anime'],
              ['manchester-united.html', 'topic-ja-rolling.js', 'manchester-united'],
              ['football.html', 'topic-ja-rolling.js', 'football'],
              ['stocks.html', 'stocks-ja.js', null],
            ];

            const structural = [];
            const pageDocuments = new Map();
            for (const [path, marker, desk] of pages) {
              const text = await raw(repo, path);
              if (text) pageDocuments.set(path, text);
              if (!text) {
                structural.push(`${path}:missing`);
                continue;
              }
              if (marker && !text.includes(marker)) structural.push(`${path}:missing-${marker}`);
              if (desk && !text.includes(`data-desk="${desk}"`)) structural.push(`${path}:wrong-desk`);
            }

            const [sourceDaily, localDaily, sourceLive, localLive, sourceDesk, localDesk, sourceStocks, localStocks] = await Promise.all([
              json(sourceRepo, 'data/latest.json'), json(repo, 'data/latest.json'),
              json(sourceRepo, 'data/live.json'), json(repo, 'data/live.json'),
              json(sourceRepo, 'data/desk-latest.json'), json(repo, 'data/desk-latest.json'),
              json(sourceRepo, 'data/stocks-latest.json'), json(repo, 'data/stocks-latest.json'),
            ]);

            const sourceDailyDay = day(sourceDaily?.date);
            const localDailyDay = day(localDaily?.date);
            const dailyCurrent = Boolean(sourceDailyDay && localDailyDay && localDailyDay >= sourceDailyDay);

            const sourceLiveMs = ms(sourceLive), localLiveMs = ms(localLive);
            const sourceDeskMs = ms(sourceDesk), localDeskMs = ms(localDesk);
            const sourceStockMs = ms(sourceStocks), localStockMs = ms(localStocks);
            const liveCurrent = currentTimestamp(sourceLiveMs, localLiveMs, MINUTE);
            const deskCurrent = currentTimestamp(sourceDeskMs, localDeskMs, HOUR);
            const stocksCurrent = currentTimestamp(sourceStockMs, localStockMs, HOUR);
            const structuralCurrent = structural.length === 0;

            const layers = {
              daily: { current: dailyCurrent, upstream: sourceDailyDay || null, japanese: localDailyDay || null },
              live: {
                current: liveCurrent,
                upstream: sourceLive?.lastUpdated || sourceLive?.generatedAt || null,
                japanese: localLive?.lastUpdated || localLive?.generatedAt || null,
                lagMinutes: lagMinutes(sourceLiveMs, localLiveMs),
              },
              desk: {
                current: deskCurrent,
                upstream: sourceDesk?.generatedAt || sourceDesk?.lastUpdated || null,
                japanese: localDesk?.generatedAt || localDesk?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceDeskMs, localDeskMs),
              },
              stocks: {
                current: stocksCurrent,
                upstream: sourceStocks?.generatedAt || sourceStocks?.lastUpdated || null,
                japanese: localStocks?.generatedAt || localStocks?.lastUpdated || null,
                lagMinutes: lagMinutes(sourceStockMs, localStockMs),
              },
              structural: { current: structuralCurrent, defects: structural, pagesChecked: pages.length },
            };

            const recovery = {
              coreRequired: !dailyCurrent || !liveCurrent,
              rollingRequired: !deskCurrent || !stocksCurrent,
              structuralRequired: !structuralCurrent,
            };
            const failures = Object.entries(layers).filter(([, value]) => value.current !== true).map(([name]) => name);
            const state = failures.length ? 'RED' : 'GREEN';
            const assessedAt = new Date().toISOString();
            const health = {
              version: 1,
              assessedAt,
              state,
              summary: state === 'GREEN' ? 'ALL_REQUIRED_NEWS_LAYERS_CURRENT' : `RECOVERY_REQUIRED:${failures.join(',')}`,
              layers,
              recovery,
              policy: {
                repairRunningRemainsRed: true,
                missingHealthFailsClosed: true,
                liveToleranceMinutes: 1,
                rollingToleranceMinutes: 60,
              },
            };

            core.info(`ROBOT state=${state} summary=${health.summary}`);
            core.info(`ROBOT Daily source=${sourceDailyDay || 'missing'} japanese=${localDailyDay || 'missing'} current=${dailyCurrent}`);
            core.info(`ROBOT Live source=${layers.live.upstream || 'missing'} japanese=${layers.live.japanese || 'missing'} current=${liveCurrent} lag=${layers.live.lagMinutes}`);
            core.info(`ROBOT Desk source=${layers.desk.upstream || 'missing'} japanese=${layers.desk.japanese || 'missing'} current=${deskCurrent} lag=${layers.desk.lagMinutes}`);
            core.info(`ROBOT Stocks source=${layers.stocks.upstream || 'missing'} japanese=${layers.stocks.japanese || 'missing'} current=${stocksCurrent} lag=${layers.stocks.lagMinutes}`);
            core.info(`ROBOT Structural current=${structuralCurrent} defects=${structural.join(',') || 'none'}`);

            const oldEntry = await entry(repo, HEALTH_PATH);
            let oldHealth = null;
            try { oldHealth = oldEntry?.text ? JSON.parse(oldEntry.text) : null; } catch (_) {}
            const semantic = (value) => JSON.stringify({
              state: value?.state,
              summary: value?.summary,
              layers: value?.layers,
              recovery: value?.recovery,
              policy: value?.policy,
            });
            const oldAssessed = Date.parse(String(oldHealth?.assessedAt || ''));
            const heartbeatDue = !Number.isFinite(oldAssessed) || Date.now() - oldAssessed >= HEALTH_HEARTBEAT_MS;
            const healthChanged = semantic(oldHealth) !== semantic(health);
            let healthCommitSha = null;
            if (healthChanged || heartbeatDue || !oldEntry) {
              const result = await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: HEALTH_PATH,
                branch: 'main',
                message: `newsroom health: ${state.toLowerCase()}`,
                content: Buffer.from(JSON.stringify(health, null, 2) + '\n').toString('base64'),
                ...(oldEntry?.sha ? { sha: oldEntry.sha } : {}),
              });
              healthCommitSha = result.data.commit.sha;
              core.warning(`ROBOT_HEALTH_PUBLISHED state=${state} commit=${healthCommitSha}`);
            } else {
              core.info('ROBOT_HEALTH_UNCHANGED heartbeat not due');
            }

            if (recovery.coreRequired) await dispatchRecovery('sync-japanese-news.yml', `daily=${!dailyCurrent} live=${!liveCurrent}`);
            if (recovery.rollingRequired) await dispatchRecovery('repair-extra-translation-quality.yml', `desk=${!deskCurrent} stocks=${!stocksCurrent}`);
            if (recovery.structuralRequired) await dispatchRecovery('auto-maintenance.yml', `structural=${structural.join(',')}`);

            // Use exactly the same deterministic content-hash cache key as
            // scripts/auto_repair_site.py so the two maintenance robots never
            // rewrite each other's SYSTEM asset references.
            async function repairSystemAssetRefs() {
              const systemText = await raw(repo, 'assets/js/system-ja.js');
              if (!systemText) {
                core.warning('SYSTEM asset self-heal skipped: assets/js/system-ja.js missing');
                return null;
              }
              const systemAssetVersion = crypto.createHash('sha256').update(systemText, 'utf8').digest('hex').slice(0, 10);
              const desired = `assets/js/system-ja.js?v=${systemAssetVersion}`;
              const replacements = [];
              for (const [path, text] of pageDocuments.entries()) {
                const next = text.replace(/assets\/js\/system-ja\.js(?:\?v=[^"'\s>]+)?/g, desired);
                if (next !== text) replacements.push({ path, content: next });
              }
              if (!replacements.length) {
                core.info(`ROBOT_SYSTEM_ASSET_CURRENT version=${systemAssetVersion}`);
                return null;
              }
              try {
                const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
                const parentSha = branch.data.commit.sha;
                const parent = await github.rest.git.getCommit({ owner, repo, commit_sha: parentSha });
                const tree = [];
                for (const item of replacements) {
                  const blob = await github.rest.git.createBlob({ owner, repo, content: item.content, encoding: 'utf-8' });
                  tree.push({ path: item.path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }
                const createdTree = await github.rest.git.createTree({ owner, repo, base_tree: parent.data.tree.sha, tree });
                const commit = await github.rest.git.createCommit({
                  owner, repo,
                  message: `Refresh SYSTEM asset hash on ${replacements.length} pages`,
                  tree: createdTree.data.sha,
                  parents: [parentSha],
                });
                await github.rest.git.updateRef({ owner, repo, ref: 'heads/main', sha: commit.data.sha, force: false });
                core.warning(`ROBOT_SYSTEM_ASSET_REPAIRED version=${systemAssetVersion} pages=${replacements.length} commit=${commit.data.sha}`);
                return commit.data.sha;
              } catch (error) {
                core.warning(`SYSTEM asset self-heal deferred: ${error.message}`);
                return null;
              }
            }

            const assetRepairCommit = await repairSystemAssetRefs();

            const branch = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const mainSha = branch.data.commit.sha;
            const pageRuns = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: 'pages.yml', per_page: 12 });
            const latestSuccessfulPage = pageRuns.data.workflow_runs.find((run) => run.conclusion === 'success');
            const activeForMain = pageRuns.data.workflow_runs.find((run) => run.status !== 'completed' && run.head_sha === mainSha);
            if (!activeForMain && (!latestSuccessfulPage || latestSuccessfulPage.head_sha !== mainSha)) {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'pages.yml', ref: 'main' });
              core.warning(`ROBOT_DISPATCH pages.yml; main=${mainSha}; healthCommit=${healthCommitSha || 'none'}; assetRepair=${assetRepairCommit || 'none'}`);
            }

            if (state === 'RED') core.setFailed(`EDITOR_IN_CHIEF_ROBOT_RED ${health.summary}`);
            else core.info('EDITOR_IN_CHIEF_ROBOT_GREEN all required reader layers current');
