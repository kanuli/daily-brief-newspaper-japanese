name: 日本語ニュース Discord 公開通知

on:
  workflow_run:
    workflows:
      - '日本語版 Pages 公開・広東語版レイアウト同期'
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-after-pages.yml'
      - 'scripts/notify_discord.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japanese-discord-publication
  cancel-in-progress: false

jobs:
  notify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 最新production mainを取得
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Pythonを設定
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: GitHub Pagesが最新ニュースを公開済みか確認
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pathlib
          import time
          import urllib.request

          local = json.loads(pathlib.Path('data/live.json').read_text(encoding='utf-8'))
          stamp = local.get('lastUpdated') or local.get('generatedAt') or ''
          url = f'https://kanuli.github.io/daily-brief-newspaper-japanese/data/live.json?discord_check={int(time.time())}'
          request = urllib.request.Request(
              url,
              headers={
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
                  'User-Agent': 'daily-brief-japanese-discord-verifier',
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              published = json.loads(response.read().decode('utf-8'))
          published_stamp = published.get('lastUpdated') or published.get('generatedAt') or ''
          if published_stamp != stamp:
              raise SystemExit(f'PAGES_NOT_CURRENT local={stamp} published={published_stamp}')
          print(f'PAGES_CURRENT_FOR_DISCORD {stamp}')
          PY

      - name: 公開版通知fingerprintを計算
        id: fingerprint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          daily = json.loads(pathlib.Path('data/latest.json').read_text(encoding='utf-8'))
          live = json.loads(pathlib.Path('data/live.json').read_text(encoding='utf-8'))

          daily_basis = str(daily.get('date') or '')
          live_basis = json.dumps({
              'lastUpdated': live.get('lastUpdated') or live.get('generatedAt') or '',
              'leadId': live.get('leadId') or '',
              'items': [
                  {
                      'id': item.get('id'),
                      'status': item.get('status'),
                      'title': item.get('title'),
                  }
                  for item in (live.get('items') or [])
              ],
          }, ensure_ascii=False, sort_keys=True)

          daily_key = hashlib.sha256(('daily|' + daily_basis).encode()).hexdigest()[:24]
          live_key = hashlib.sha256(('live|' + live_basis).encode()).hexdigest()[:24]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'daily_key={daily_key}\n')
              handle.write(f'live_key={live_key}\n')
              handle.write(f'daily_date={daily_basis}\n')
              handle.write(f'live_stamp={live.get("lastUpdated") or live.get("generatedAt") or ""}\n')
          PY

      - name: Daily通知済みfingerprintを確認
        id: daily_cache
        uses: actions/cache/restore@v4
        with:
          path: .discord-state/daily
          key: jp-discord-daily-${{ steps.fingerprint.outputs.daily_key }}

      - name: Live通知済みfingerprintを確認
        id: live_cache
        uses: actions/cache/restore@v4
        with:
          path: .discord-state/live
          key: jp-discord-live-${{ steps.fingerprint.outputs.live_key }}

      - name: 公開済みニュースをDiscordへ通知
        id: discord_notify
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAILY_CACHE_HIT: ${{ steps.daily_cache.outputs.cache-hit }}
          LIVE_CACHE_HIT: ${{ steps.live_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo 'DISCORD_WEBHOOK_URL secret is missing.' >&2
            exit 1
          fi

          mkdir -p .discord-state

          # The workflow-file creation/update push is a safe bootstrap: do not
          # backfill an old Daily alert, but send the currently published Live
          # window once so the connection is immediately proven.
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            touch .discord-state/daily
            if [ "${LIVE_CACHE_HIT:-false}" != 'true' ]; then
              python scripts/notify_discord.py --published-live
              touch .discord-state/live
            fi
            exit 0
          fi

          # At the first successful Pages publication of a new Daily edition,
          # send one Daily alert and mark the same Live window as covered so
          # users do not receive two notices for the same publication.
          if [ "${DAILY_CACHE_HIT:-false}" != 'true' ]; then
            python scripts/notify_discord.py --daily
            touch .discord-state/daily
            touch .discord-state/live
          elif [ "${LIVE_CACHE_HIT:-false}" != 'true' ]; then
            python scripts/notify_discord.py --published-live
            touch .discord-state/live
          else
            echo 'DISCORD_NOTIFICATION_ALREADY_SENT for this published fingerprint.'
          fi

      - name: Daily通知済みfingerprintを保存
        if: ${{ success() && steps.daily_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .discord-state/daily
          key: jp-discord-daily-${{ steps.fingerprint.outputs.daily_key }}

      - name: Live通知済みfingerprintを保存
        if: ${{ success() && steps.live_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .discord-state/live
          key: jp-discord-live-${{ steps.fingerprint.outputs.live_key }}
