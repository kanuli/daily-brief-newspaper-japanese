<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アーカイブ｜日本語版デイリー・ブリーフ</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Noto+Serif+JP:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/newspaper.css?v=20260823-2044"></head><body data-page="archive"><div class="paper"><div class="utility-bar"><span>個人版・アーカイブ</span><span>日本語</span></div><header class="masthead"><div></div><div class="brand"><h1>アーカイブ</h1><div class="brand-sub">過去の日刊版</div></div><div></div></header><nav class="section-nav" aria-label="ニュース分野"></nav><main><h1 class="topic-title">日刊版アーカイブ</h1><div id="archive-items"><p>読み込み中…</p></div></main><footer class="footer"><span>日本語版デイリー・ブリーフ</span><a href="index.html">トップへ</a></footer></div><script src="assets/js/system-ja.js?v=20260823-2044" defer></script><script>fetch('data/archive.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(d=>{const items=Array.isArray(d)?d:(d.editions||d.items||[]);document.getElementById('archive-items').innerHTML=items.length?items.map(x=>`<article class="top-card"><h3>${String(x.dateLabel||x.date||'').replace(/[<>&]/g,'')}</h3><p>${String(x.title||x.tagline||'日刊版').replace(/[<>&]/g,'')}</p></article>`).join(''):'<p class="empty">保存済みの日刊版はまだありません。</p>'}).catch(()=>document.getElementById('archive-items').innerHTML='<p class="empty">アーカイブデータは次回同期で作成されます。</p>')</script></body></html>
